<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MarketEye — 기업 비교 대시보드</title>
<style>
  :root {
    --bg: #0d1117;
    --surface: #161b22;
    --surface2: #21262d;
    --border: #30363d;
    --text: #e6edf3;
    --muted: #8b949e;
    --green: #3fb950;
    --red: #f85149;
    --blue: #58a6ff;
    --yellow: #d29922;
    --purple: #bc8cff;
    --accent: #1f6feb;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: var(--bg); color: var(--text); font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; font-size: 14px; }

  header { background: var(--surface); border-bottom: 1px solid var(--border); padding: 0 24px; height: 56px; display: flex; align-items: center; gap: 16px; position: sticky; top: 0; z-index: 100; transition: transform .3s ease; }
  header.header-hidden { transform: translateY(-100%); }
  #refresh-info { font-size: 11px; color: var(--muted); white-space: nowrap; }
  #refresh-info span { color: var(--green); }
  header h1 { font-size: 18px; font-weight: 700; color: var(--blue); letter-spacing: -0.5px; }
  header h1 span { color: var(--text); }

  #search-bar { display: flex; gap: 8px; flex: 1; max-width: 600px; margin-left: auto; }
  #ticker-input { background: var(--surface2); border: 1px solid var(--border); color: var(--text); padding: 8px 12px; border-radius: 6px; font-size: 14px; width: 100%; outline: none; transition: border-color .2s; }
  #ticker-input:focus { border-color: var(--accent); }
  #ticker-input::placeholder { color: var(--muted); }
  button { background: var(--accent); color: #fff; border: none; padding: 8px 16px; border-radius: 6px; cursor: pointer; font-size: 14px; font-weight: 600; transition: opacity .2s; white-space: nowrap; }
  button:hover { opacity: .85; }
  button.secondary { background: var(--surface2); border: 1px solid var(--border); color: var(--text); font-weight: 400; }

  #suggestions { position: absolute; top: calc(100% + 4px); left: 0; right: 0; background: var(--surface); border: 1px solid var(--border); border-radius: 8px; z-index: 200; display: none; overflow: hidden; box-shadow: 0 8px 24px rgba(0,0,0,.4); }
  .sug-item { display: flex; align-items: center; gap: 8px; padding: 9px 12px; cursor: pointer; transition: background .1s; }
  .sug-item:hover, .sug-selected { background: var(--surface2); }
  .sug-dim { opacity: .4; cursor: default; }
  .sug-ticker { font-size: 13px; font-weight: 700; color: var(--blue); min-width: 100px; }
  .sug-name { font-size: 12px; color: var(--text); flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .sug-exch { font-size: 10px; color: var(--muted); background: var(--surface2); padding: 2px 6px; border-radius: 4px; }

  main { padding: 20px 24px; }

  #loading-bar { height: 3px; background: var(--accent); width: 0%; transition: width .3s; position: fixed; top: 56px; left: 0; z-index: 99; }

  /* 탭 */
  .tabs { display: flex; gap: 4px; margin-bottom: 16px; border-bottom: 1px solid var(--border); padding-bottom: 0; }
  .tab-btn { background: none; border: none; color: var(--muted); padding: 8px 16px; cursor: pointer; font-size: 14px; border-bottom: 2px solid transparent; margin-bottom: -1px; border-radius: 0; font-weight: 500; }
  .tab-btn.active { color: var(--blue); border-bottom-color: var(--blue); }
  .tab-btn:hover { color: var(--text); }

  /* 국내장/해외장 시장 선택 바 (그룹 상위 분류) */
  #market-bar { display: flex; gap: 8px; align-items: center; margin-bottom: 12px; }
  .market-pill { display: inline-flex; align-items: center; gap: 7px; background: var(--surface); border: 1px solid var(--border); color: var(--muted); padding: 8px 18px; border-radius: 10px; cursor: pointer; font-size: 14px; font-weight: 600; user-select: none; transition: all .15s; }
  .market-pill:hover { border-color: var(--accent); color: var(--text); }
  .market-pill.active { background: var(--accent); border-color: var(--accent); color: #fff; }
  .market-pill .group-count { font-weight: 400; }

  /* 그룹(워치리스트) 바 */
  #group-bar { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; margin-bottom: 16px; }
  .group-pill { display: inline-flex; align-items: center; gap: 6px; background: var(--surface); border: 1px solid var(--border); color: var(--muted); padding: 6px 10px 6px 14px; border-radius: 20px; cursor: pointer; font-size: 13px; user-select: none; transition: all .15s; }
  .group-pill:hover { border-color: var(--accent); color: var(--text); }
  .group-pill.active { background: var(--accent); border-color: var(--accent); color: #fff; }
  .group-count { font-size: 11px; background: rgba(255,255,255,.12); border-radius: 10px; padding: 1px 7px; }
  .group-pill.active .group-count { background: rgba(255,255,255,.25); }
  .group-edit { background: none; border: none; color: inherit; cursor: pointer; font-size: 12px; opacity: .55; padding: 0 2px; line-height: 1; }
  .group-edit:hover { opacity: 1; }
  .group-del { background: none; border: none; color: inherit; cursor: pointer; font-size: 12px; opacity: .55; padding: 0 2px; line-height: 1; }
  .group-del:hover { opacity: 1; }
  .group-add { background: none; border: 1px dashed var(--border); color: var(--muted); padding: 6px 12px; border-radius: 20px; cursor: pointer; font-size: 13px; }
  .group-add:hover { border-color: var(--accent); color: var(--text); }

  /* 카드 그리드 */
  #cards-container { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 16px; margin-bottom: 24px; }
  .stock-card { background: var(--surface); border: 1px solid var(--border); border-radius: 10px; padding: 16px; position: relative; transition: border-color .2s; }
  .stock-card:hover { border-color: var(--accent); }
  .stock-card { cursor: grab; }
  .stock-card.dragging { opacity: .4; cursor: grabbing; }
  .stock-card.drag-over { border-color: var(--blue); box-shadow: 0 0 0 2px var(--blue) inset; }
  .card-header { display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 12px; }
  .card-ticker { font-size: 20px; font-weight: 700; color: var(--blue); }
  .card-name { font-size: 11px; color: var(--muted); margin-top: 2px; max-width: 160px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .card-price { text-align: right; }
  .card-price-val { font-size: 22px; font-weight: 700; }
  .card-change { font-size: 12px; margin-top: 2px; }
  .up { color: var(--green); }
  .down { color: var(--red); }
  .neutral { color: var(--muted); }
  .card-remove { position: absolute; top: 10px; right: 10px; background: none; border: none; color: var(--muted); cursor: pointer; font-size: 16px; padding: 2px 6px; border-radius: 4px; }
  .card-remove:hover { background: var(--surface2); color: var(--red); }

  /* ── 실시간 랭킹 ── */
  .rank-head { display: flex; align-items: baseline; gap: 10px; margin-bottom: 12px; }
  .rank-head h2 { font-size: 18px; font-weight: 700; }
  .rank-meta { font-size: 12px; color: var(--muted); }
  .rank-chips { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 12px; }
  .rank-chip { background: var(--surface2); border: 1px solid var(--border); color: var(--muted); padding: 6px 14px; border-radius: 20px; cursor: pointer; font-size: 13px; }
  .rank-chip:hover { color: var(--text); }
  .rank-chip.active { background: var(--text); color: var(--bg); border-color: var(--text); font-weight: 700; }
  .rank-toggle { display: inline-flex; align-items: center; gap: 6px; margin-left: auto; font-size: 13px; color: var(--muted); cursor: pointer; user-select: none; }
  .rank-toggle input { accent-color: var(--accent); width: 15px; height: 15px; cursor: pointer; }
  .rank-list { background: var(--surface); border: 1px solid var(--border); border-radius: 12px; overflow: hidden; }
  .rank-row { display: grid; grid-template-columns: 28px 36px minmax(0, 1fr) 80px auto 32px; align-items: center; gap: 10px; padding: 10px 14px; cursor: pointer; border-bottom: 1px solid var(--border); }
  .rank-row:last-child { border-bottom: none; }
  .rank-row:hover { background: var(--surface2); }
  .rank-no { font-weight: 700; text-align: center; color: var(--muted); }
  .rank-row:nth-child(-n+3) .rank-no { color: var(--text); }
  .rank-logo { width: 32px; height: 32px; border-radius: 50%; background: var(--surface2); object-fit: cover; }
  .rank-name { font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .rank-name .rank-etf { font-size: 10px; color: var(--muted); border: 1px solid var(--border); border-radius: 4px; padding: 0 4px; margin-left: 4px; vertical-align: middle; }
  .rank-sub { font-size: 12px; color: var(--muted); margin-top: 2px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .rank-spark { width: 80px; height: 32px; object-fit: contain; }
  .rank-price { text-align: right; white-space: nowrap; }
  .rank-price b { font-size: 15px; }
  .rank-price div { font-size: 12px; margin-top: 2px; }
  .rank-fav { background: none; border: none; color: var(--muted); font-size: 18px; cursor: pointer; padding: 4px; }
  .rank-fav.on { color: var(--yellow); }
  .rank-empty { padding: 32px; text-align: center; color: var(--muted); }
  .rank-empty button { margin-top: 12px; }
  @media (max-width: 600px) {
    .rank-spark { display: none; }
    .rank-row { grid-template-columns: 22px 30px minmax(0, 1fr) auto 28px; gap: 8px; padding: 10px; }
  }
  /* 랭킹 옆 상세 패널 — 데스크톱은 화면을 좌우로 나누고, 모바일은 아래에서 올라오는 시트 */
  #side-panel { position: fixed; top: 0; right: 0; bottom: 0; width: min(480px, 42vw); background: var(--bg); border-left: 1px solid var(--border); z-index: 150; display: none; flex-direction: column; box-shadow: -8px 0 24px rgba(0,0,0,.35); }
  body.panel-open #side-panel { display: flex; }
  body.panel-open main, body.panel-open header { margin-right: min(480px, 42vw); }
  .sp-head { display: flex; align-items: center; gap: 10px; padding: 12px 14px; border-bottom: 1px solid var(--border); background: var(--surface); }
  .sp-head .rank-logo { flex-shrink: 0; }
  .sp-title { flex: 1; min-width: 0; }
  .sp-title b { font-size: 16px; display: block; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .sp-title span { font-size: 12px; color: var(--muted); }
  .sp-btn { background: none; border: 1px solid var(--border); color: var(--text); padding: 4px 10px; font-size: 14px; font-weight: 400; border-radius: 6px; flex-shrink: 0; }
  .sp-btn.on { color: var(--yellow); }
  .sp-close { font-size: 18px; line-height: 1; padding: 4px 10px; }
  .sp-nav { display: flex; gap: 6px; padding: 8px 14px; border-bottom: 1px solid var(--border); font-size: 12px; color: var(--muted); align-items: center; }
  .sp-nav button { font-size: 12px; padding: 4px 10px; }
  .sp-nav .sp-pos { flex: 1; text-align: center; }
  #sp-body { flex: 1; overflow-y: auto; padding: 14px; }
  #sp-body .signal-card { border: none; padding: 0; background: none; }
  .sp-msg { padding: 40px 10px; text-align: center; color: var(--muted); line-height: 1.7; }
  .rank-row.sel { background: var(--surface2); box-shadow: inset 3px 0 0 var(--accent); }
  #panel-backdrop { display: none; position: fixed; inset: 0; background: rgba(0,0,0,.45); z-index: 140; }
  @media (max-width: 900px) {
    #side-panel { top: auto; left: 0; width: auto; height: 86vh; border-left: none; border-top: 1px solid var(--border); border-radius: 14px 14px 0 0; box-shadow: 0 -8px 24px rgba(0,0,0,.45); }
    body.panel-open main, body.panel-open header { margin-right: 0; }
    body.panel-open #panel-backdrop { display: block; }   /* 시트 위 어두운 부분을 누르면 닫힘 */
    .sp-head { border-radius: 14px 14px 0 0; }
  }
  /* 모의투자 */
  .pp-head { display: flex; align-items: baseline; gap: 10px; flex-wrap: wrap; margin-bottom: 12px; }
  .pp-head h2 { font-size: 18px; font-weight: 700; }
  .pp-note { font-size: 12px; color: var(--yellow); }
  .pp-summary { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 10px; margin-bottom: 14px; }
  .pp-stat { background: var(--surface); border: 1px solid var(--border); border-radius: 12px; padding: 12px 14px; min-width: 0; }
  .pp-k { font-size: 12px; color: var(--muted); }
  .pp-v { font-size: 18px; font-weight: 700; margin-top: 4px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .pp-s { font-size: 12px; margin-top: 2px; }
  .pp-grid { display: grid; grid-template-columns: 340px minmax(0, 1fr); gap: 14px; margin-bottom: 14px; align-items: start; }
  .pp-card { background: var(--surface); border: 1px solid var(--border); border-radius: 12px; padding: 14px; margin-bottom: 14px; min-width: 0; }
  .pp-grid .pp-card { margin-bottom: 0; }
  .pp-title { font-size: 15px; font-weight: 700; margin-bottom: 10px; display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
  .pp-title .rank-meta { font-weight: 400; }
  .pp-side { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; margin-bottom: 10px; }
  .pp-side button { background: var(--surface2); border: 1px solid var(--border); color: var(--muted); font-weight: 600; }
  .pp-side button.on-buy { background: var(--red); border-color: var(--red); color: #fff; }
  .pp-side button.on-sell { background: var(--blue); border-color: var(--blue); color: #fff; }
  .pp-field { margin-bottom: 10px; }
  .pp-field > label { display: block; font-size: 12px; color: var(--muted); margin-bottom: 4px; }
  .pp-field input[type=text], .pp-field input[type=number], .pp-field input[type=datetime-local] { width: 100%; background: var(--surface2); border: 1px solid var(--border); color: var(--text); padding: 8px 10px; border-radius: 6px; font-size: 14px; outline: none; color-scheme: dark; }
  .pp-field input:focus { border-color: var(--accent); }
  .pp-row2 { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
  .pp-when { display: flex; gap: 14px; margin-bottom: 6px; font-size: 13px; }
  .pp-when label { display: flex; align-items: center; gap: 4px; cursor: pointer; }
  .pp-hint { font-size: 11px; color: var(--muted); margin-top: 4px; line-height: 1.5; }
  .pp-sug { position: absolute; top: calc(100% + 2px); left: 0; right: 0; background: var(--surface); border: 1px solid var(--border); border-radius: 8px; z-index: 50; overflow: hidden; box-shadow: 0 8px 24px rgba(0,0,0,.4); }
  .pp-sug:empty { display: none; }
  .pp-preview { margin-top: 10px; background: var(--surface2); border: 1px solid var(--border); border-radius: 8px; padding: 10px 12px; font-size: 13px; line-height: 1.7; }
  .pp-preview:empty { display: none; }
  .pp-preview .pp-err { color: var(--red); }
  .pp-preview .pp-btns { display: flex; gap: 6px; margin-top: 8px; }
  .pp-preview .pp-btns button { flex: 1; }
  .pp-kv { display: flex; justify-content: space-between; gap: 10px; }
  .pp-kv span:first-child { color: var(--muted); }
  .pp-table { width: 100%; border-collapse: collapse; font-size: 13px; }
  .pp-table th { text-align: right; color: var(--muted); font-weight: 500; font-size: 12px; padding: 6px 8px; border-bottom: 1px solid var(--border); white-space: nowrap; }
  .pp-table td { text-align: right; padding: 8px; border-bottom: 1px solid var(--border); white-space: nowrap; }
  .pp-table th:first-child, .pp-table td:first-child { text-align: left; }
  .pp-table tr:last-child td { border-bottom: none; }
  .pp-table .pp-name { font-weight: 600; max-width: 160px; overflow: hidden; text-overflow: ellipsis; }
  .pp-table .pp-tk { font-size: 11px; color: var(--muted); }
  .pp-scroll { overflow-x: auto; }
  .pp-mini { background: var(--surface2); border: 1px solid var(--border); color: var(--text); font-size: 12px; font-weight: 400; padding: 4px 10px; }
  .pp-empty { color: var(--muted); font-size: 13px; padding: 14px 0; text-align: center; }
  .pp-order { display: flex; align-items: center; gap: 10px; padding: 9px 0; border-bottom: 1px solid var(--border); font-size: 13px; }
  .pp-order:last-child { border-bottom: none; }
  .pp-order .pp-main { flex: 1; min-width: 0; }
  .pp-order .pp-sub { font-size: 12px; color: var(--muted); margin-top: 2px; }
  .pp-chip { font-size: 11px; padding: 2px 7px; border-radius: 10px; border: 1px solid var(--border); white-space: nowrap; }
  .pp-chip.filled { color: var(--green); border-color: var(--green); }
  .pp-chip.pending { color: var(--yellow); border-color: var(--yellow); }
  .pp-chip.failed, .pp-chip.canceled { color: var(--muted); }
  .pp-badges { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 10px; margin-bottom: 12px; }
  .pp-badge { background: var(--surface2); border-radius: 10px; padding: 10px 12px; }
  .pp-badge b { display: block; font-size: 20px; margin-top: 2px; }
  .pp-explain { font-size: 12px; color: var(--muted); line-height: 1.6; margin-top: 10px; }
  .pp-filter { display: flex; gap: 6px; }
  .pp-foot { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; font-size: 12px; color: var(--muted); }
  @media (max-width: 768px) {
    .pp-summary { grid-template-columns: repeat(2, minmax(0, 1fr)); }
    .pp-grid { grid-template-columns: minmax(0, 1fr); }
    .pp-badges { grid-template-columns: minmax(0, 1fr); }
    .pp-v { font-size: 16px; }
  }
  .card-fav { background: none; border: none; color: var(--muted); cursor: pointer; font-size: 18px; padding: 0; line-height: 1; flex-shrink: 0; }
  .card-fav:hover { color: var(--yellow); }
  .card-fav.on { color: var(--yellow); }
  .group-pill.fav-pill { border-color: rgba(210,153,34,.5); }
  .group-pill.fav-pill.active { background: var(--yellow); border-color: var(--yellow); color: #1a1a1a; }
  .card-metrics { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; }
  .metric { background: var(--surface2); border-radius: 6px; padding: 8px; }
  .metric-label { font-size: 10px; color: var(--muted); text-transform: uppercase; letter-spacing: .5px; }
  .metric-val { font-size: 14px; font-weight: 600; margin-top: 2px; }
  .mini-chart { height: 50px; margin: 10px 0; }

  /* 비교 테이블 */
  #compare-section { overflow-x: auto; }
  .compare-table { width: 100%; border-collapse: collapse; min-width: 600px; }
  .compare-table th, .compare-table td { padding: 10px 14px; text-align: right; border-bottom: 1px solid var(--border); white-space: nowrap; }
  .compare-table th { background: var(--surface); color: var(--muted); font-size: 11px; font-weight: 600; text-transform: uppercase; letter-spacing: .5px; position: sticky; top: 0; }
  .compare-table td:first-child, .compare-table th:first-child { text-align: left; color: var(--muted); font-size: 12px; position: sticky; left: 0; background: var(--bg); min-width: 160px; }
  .compare-table tr:hover td { background: var(--surface2); }
  .compare-table tr:hover td:first-child { background: var(--surface2); }
  .compare-table .best { color: var(--green); font-weight: 700; }
  .compare-table .worst { color: var(--red); }
  .ticker-head { color: var(--blue) !important; font-size: 14px !important; font-weight: 700 !important; text-transform: none !important; }
  .section-header { font-size: 11px; font-weight: 700; color: var(--purple); text-transform: uppercase; letter-spacing: 1px; padding: 14px 14px 4px !important; border-bottom: none !important; background: var(--bg) !important; }
  .section-header td { border-bottom: none !important; padding: 14px 14px 4px !important; }

  /* 차트 비교 */
  #charts-section { display: grid; grid-template-columns: repeat(auto-fill, minmax(320px, 1fr)); gap: 16px; }
  .chart-card { background: var(--surface); border: 1px solid var(--border); border-radius: 10px; padding: 16px; }
  .chart-card h3 { font-size: 13px; color: var(--muted); margin-bottom: 12px; }
  canvas { width: 100% !important; }

  /* 신호 배지 */
  .signal-badge { display: inline-flex; align-items: center; gap: 5px; font-size: 11px; font-weight: 700; padding: 3px 8px; border-radius: 12px; margin-top: 10px; }
  .signal-badge.buy  { background: rgba(63,185,80,.18); color: var(--green); border: 1px solid rgba(63,185,80,.4); }
  .signal-badge.wait { background: rgba(210,153,34,.18); color: var(--yellow); border: 1px solid rgba(210,153,34,.4); }
  .signal-badge.warn { background: rgba(248,81,73,.18); color: var(--red); border: 1px solid rgba(248,81,73,.4); }

  /* 신호 탭 */
  .signal-section-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px,1fr)); gap: 16px; }
  .signal-card { background: var(--surface); border: 1px solid var(--border); border-radius: 10px; padding: 18px; }
  .signal-card-header { display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 14px; }
  .signal-name { font-size: 16px; font-weight: 700; color: var(--blue); }
  .signal-ticker-label { font-size: 11px; color: var(--muted); margin-top: 2px; }
  .signal-block { margin-bottom: 16px; padding-top: 12px; border-top: 1px solid var(--border); }
  .signal-block:first-of-type { border-top: none; padding-top: 0; }
  .signal-block-head { display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; gap: 8px; flex-wrap: wrap; }
  .signal-block-title { font-size: 13px; font-weight: 700; color: var(--text); }
  .signal-block-score { display: inline-flex; align-items: center; }
  .signal-bars { display: flex; flex-direction: column; gap: 8px; margin-bottom: 14px; }
  .signal-bar-row { display: flex; align-items: center; gap: 8px; font-size: 12px; }
  .signal-bar-label { color: var(--muted); width: 90px; flex-shrink: 0; }
  .signal-bar-track { flex: 1; height: 6px; background: var(--surface2); border-radius: 3px; overflow: hidden; }
  .signal-bar-fill { height: 100%; border-radius: 3px; transition: width .5s; }
  .signal-bar-val { color: var(--text); width: 36px; text-align: right; flex-shrink: 0; }
  .signal-indicators { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; font-size: 12px; }
  .signal-ind-item { background: var(--surface2); border-radius: 6px; padding: 8px 10px; }
  .signal-ind-key { color: var(--muted); font-size: 10px; margin-bottom: 2px; }
  .signal-ind-val { font-weight: 600; }
  .signal-loading { color: var(--muted); text-align: center; padding: 40px; }

  /* 빈 상태 */
  #empty-state { text-align: center; padding: 80px 20px; color: var(--muted); }
  #empty-state h2 { font-size: 24px; margin-bottom: 8px; color: var(--text); }
  #empty-state p { font-size: 14px; margin-bottom: 24px; }
  .ticker-chips { display: flex; flex-wrap: wrap; gap: 8px; justify-content: center; }
  .ticker-chip { background: var(--surface2); border: 1px solid var(--border); color: var(--blue); padding: 6px 14px; border-radius: 20px; cursor: pointer; font-size: 13px; transition: all .2s; }
  .ticker-chip:hover { background: var(--accent); color: #fff; border-color: var(--accent); }

  #error-toast { position: fixed; bottom: 24px; right: 24px; background: #da3633; color: #fff; padding: 12px 20px; border-radius: 8px; font-size: 14px; z-index: 999; display: none; max-width: 300px; }

  .loading-card { background: var(--surface); border: 1px solid var(--border); border-radius: 10px; padding: 16px; min-height: 200px; display: flex; align-items: center; justify-content: center; color: var(--muted); }
  .spinner { width: 24px; height: 24px; border: 3px solid var(--border); border-top-color: var(--blue); border-radius: 50%; animation: spin 0.8s linear infinite; margin-right: 10px; }
  @keyframes spin { to { transform: rotate(360deg); } }

  /* ── 모바일 반응형 ── */
  @media (max-width: 768px) {
    /* 헤더: 2줄 레이아웃 */
    header {
      flex-wrap: wrap;
      height: auto;
      padding: 10px 14px;
      gap: 8px;
    }
    header h1 { font-size: 16px; }
    #sync-btn { margin-left: auto; padding: 7px 10px; font-size: 12px; }
    #refresh-info { font-size: 10px; order: 4; width: 100%; }
    #search-bar {
      order: 3;
      flex: 1 1 100%;
      max-width: 100%;
      margin-left: 0;
      flex-wrap: wrap;
      gap: 6px;
    }
    #ticker-input { font-size: 16px; /* iOS 줌 방지 */ }
    #search-bar button { padding: 8px 12px; font-size: 13px; }

    /* main 여백 축소 */
    main { padding: 12px 14px; }

    /* 그룹 바 스크롤 */
    #group-bar { flex-wrap: nowrap; overflow-x: auto; padding-bottom: 4px; -webkit-overflow-scrolling: touch; }
    /* 탭이 5개라 폰 폭을 넘는다 → 페이지 대신 탭 줄만 가로 스크롤 */
    .tabs { overflow-x: auto; scrollbar-width: none; -webkit-overflow-scrolling: touch; }
    .tabs::-webkit-scrollbar { display: none; }
    .tab-btn { flex-shrink: 0; white-space: nowrap; padding: 8px 12px; margin-bottom: 0; }
    #group-bar::-webkit-scrollbar { display: none; }
    .group-pill, .group-add { flex-shrink: 0; white-space: nowrap; }
    .group-pill span:first-child { white-space: nowrap; }

    /* 탭 버튼 */
    .tabs { gap: 0; }
    .tab-btn { padding: 8px 12px; font-size: 13px; flex: 1; text-align: center; }

    /* 카드: 1열 */
    #cards-container { grid-template-columns: 1fr; gap: 12px; }
    .stock-card { padding: 14px; }
    .card-ticker { font-size: 17px; }
    .card-price-val { font-size: 19px; }

    /* 비교 테이블: 가로 스크롤 유지, 첫 열 고정 */
    #compare-section { -webkit-overflow-scrolling: touch; }
    .compare-table th, .compare-table td { padding: 8px 10px; font-size: 12px; }
    .compare-table td:first-child, .compare-table th:first-child { min-width: 120px; font-size: 11px; }

    /* 차트: 1열 */
    #charts-section { grid-template-columns: 1fr; }

    /* 신호 탭 */
    .signal-section-grid { grid-template-columns: 1fr; }

    /* 에러 토스트 */
    #error-toast { left: 14px; right: 14px; bottom: 14px; max-width: 100%; }

    /* 빈 상태 */
    #empty-state { padding: 40px 16px; }
    #empty-state h2 { font-size: 18px; }
    .ticker-chips { gap: 6px; }
    .ticker-chip { font-size: 12px; padding: 5px 10px; }
  }
</style>

<body>

        <span class="ticker-chip" onclick="quickAdd('GOOGL')">GOOGL · 알파벳</span>

        <span class="ticker-chip" onclick="quickAdd('NVDA')">NVDA · 엔비디아</span>

<div id="panel-backdrop" onclick="closeRankPanel()"></div>
<aside id="side-panel" aria-label="종목 상세"></aside>
<div id="error-toast"></div>

<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
<script>
// 로컬(파일/localhost)에서는 Flask(:5001)를, 배포 환경에서는 같은 출처(/api)를 사용
const _isLocal = location.protocol === 'file:'
  || ['localhost', '127.0.0.1', ''].includes(location.hostname);
const API = _isLocal ? 'http://localhost:5001/api' : '/api';

// ── 디버그 fetch 래퍼 (타임아웃 30s + 단계별 콘솔 로그) ──────────
// Render 무료 플랜은 미사용 시 인스턴스를 내려, 첫 요청(콜드 스타트)이 최대 ~60초
// 걸린다. 그 첫 요청에만 넉넉한 타임아웃을 주려고 timeoutMs를 호출부에서 덮어쓸 수
// 있게 했다. (인자를 생략하면 기존과 100% 동일하게 30초로 동작)
const FETCH_TIMEOUT_MS = 30000;
async function apiFetch(url, options = {}, timeoutMs = FETCH_TIMEOUT_MS) {
  const label = url.replace(API, '');
  const controller = new AbortController();
  const tid = setTimeout(() => {
    controller.abort();
    console.error(`[MarketEye] ⏰ TIMEOUT (${timeoutMs/1000}s): ${label}`);
  }, timeoutMs);
  const t0 = performance.now();
  console.log(`[MarketEye] ▶ 요청: ${label}`);
  try {
    const res = await fetch(url, { ...options, signal: controller.signal });
    const ms = Math.round(performance.now() - t0);
    if (!res.ok) {
      console.warn(`[MarketEye] ⚠ HTTP ${res.status} (${ms}ms): ${label}`);
    } else {
      const slow = ms > 10000 ? ' 🐢 매우 느림!' : ms > 3000 ? ' ⏱ 느림' : '';
      console.log(`[MarketEye] ✔ 완료 (${ms}ms)${slow}: ${label}`);
    }
    return res;
  } catch(e) {
    const ms = Math.round(performance.now() - t0);
    if (e.name === 'AbortError') {
      throw new Error(`요청 타임아웃 (${timeoutMs/1000}초 초과) — 서버가 응답하지 않습니다`);
    }
    console.error(`[MarketEye] ✖ 실패 (${ms}ms): ${label} — ${e.message}`);
    throw e;
  } finally {
    clearTimeout(tid);
  }
}
let stocks = {};   // ticker -> data
let signals = {};  // ticker -> signal data
let activeTab = 'overview';

// ---- 그룹(워치리스트) 모델 ----
let groups = [];      // [{id, name, tickers:[...]}]
let activeId = null;  // 현재 선택된 그룹 id
let syncCode = localStorage.getItem('marketeye_sync_code') || ''; // 로그인(접속) 코드 — 자동 로그인용으로만 보관
function genId() { return 'g' + Date.now().toString(36) + Math.random().toString(36).slice(2,5); }
function curGroup() { return groups.find(g => g.id === activeId) || groups[0]; }
// 화면에 보일 티커. 즐겨찾기·빠른조회는 두 시장 종목이 섞여 담기므로 선택한 시장
// (국내장/해외장) 종목만 보여준다. 실제 그룹은 추가 시점에 시장이 강제되므로 그대로.
function viewTickers(g) {
  if (!g) return [];
  return isSpecialGroup(g.id) ? g.tickers.filter(t => tickerMarket(t) === selectedMarket) : g.tickers;
}
// 현재 그룹에서 데이터 로드가 끝난 티커들을 사용자가 정한 순서대로 반환
function orderedTickers() { return viewTickers(curGroup()).filter(t => stocks[t]); }

// ---- 국내장 / 해외장 (그룹의 상위 분류) ----
// 상단에서 시장을 먼저 고르고, 그 시장에 속한 그룹만 그룹 바에 노출한다(폴더식).
let selectedMarket = 'kr';   // 'kr'(국내장) | 'us'(해외장)
// 티커의 시장 판별: .KS/.KQ 또는 6자리 숫자코드 → 국내(kr), 그 외 → 해외(us)
function tickerMarket(t) { return (/\.(KS|KQ)$/i.test(t) || /^\d{6}$/.test(t)) ? 'kr' : 'us'; }
// 즐겨찾기·빠른조회는 시장에 얽매이지 않는 특수 그룹(두 시장 공통 노출).
function isSpecialGroup(id) { return id === FAV_ID || id === QUICK_ID; }
// 그룹의 시장. market 필드가 있으면 그대로, 없으면(구버전 데이터) 담긴 종목 다수결로 추론.
function groupMarket(g) {
  if (g.market === 'kr' || g.market === 'us') return g.market;
  let kr = 0, us = 0;
  (g.tickers || []).forEach(t => tickerMarket(t) === 'kr' ? kr++ : us++);
  return us > kr ? 'us' : 'kr';
}
// 구버전 데이터 마이그레이션: 실제 그룹에 market 필드가 없으면 추론값을 확정 저장한다.
function migrateGroupMarkets() {
  groups.forEach(g => {
    if (!isSpecialGroup(g.id) && g.market !== 'kr' && g.market !== 'us') g.market = groupMarket(g);
  });
}

// ---- 즐겨찾기(항상 존재하는 특수 그룹) ----
// 별도 데이터 구조 대신 '특수 그룹'으로 두어 기존 동기화·렌더 로직을 그대로 재사용한다.
const FAV_ID = '__fav__';
function favGroup() { return groups.find(g => g.id === FAV_ID); }
function ensureFav() {  // 즐겨찾기 그룹이 없으면 맨 앞에 생성
  if (!groups.some(g => g.id === FAV_ID)) {
    groups.unshift({ id: FAV_ID, name: '⭐ 즐겨찾기', tickers: [] });
  }
}
function isFav(t) { const f = favGroup(); return !!(f && f.tickers.includes(t)); }
function toggleFav(t) {
  const f = favGroup(); if (!f) return;
  const i = f.tickers.indexOf(t);
  if (i >= 0) f.tickers.splice(i, 1); else f.tickers.push(t);
  saveState();
  renderGroupBar();
  const btn = document.getElementById('fav-' + t);
  if (btn) {
    const on = isFav(t);
    btn.textContent = on ? '★' : '☆';
    btn.classList.toggle('on', on);
    btn.title = on ? '즐겨찾기 해제' : '즐겨찾기 추가';
  }
  if (curGroup() && curGroup().id === FAV_ID) renderCards();  // 즐겨찾기 보는 중이면 갱신
}

// ---- 빠른 조회(저장·동기화 안 되는 임시 그룹) ----
// 그냥 검색해서 잠깐 보고 싶을 때 쓰는 모드. 서버/진짜 그룹에 저장되지 않아
// 새로고침하면 비워지고, 다른 워치리스트 그룹을 오염시키지 않는다.
const QUICK_ID = '__quick__';
function ensureQuick() {  // 즐겨찾기 바로 다음에 생성 (없을 때만)
  if (!groups.some(g => g.id === QUICK_ID)) {
    const favIdx = groups.findIndex(g => g.id === FAV_ID);
    groups.splice(favIdx >= 0 ? favIdx + 1 : 0, 0,
      { id: QUICK_ID, name: '🔍 빠른 조회', tickers: [] });
  }
}

// 한국 종목코드(숫자)를 KRX 검색으로 .KS/.KQ 정확히 해석
async function resolveKrTicker(code) {
  try {
    const res = await apiFetch(`${API}/search?q=${encodeURIComponent(code)}`);
    const list = await res.json();
    const hit = list.find(r => r.ticker.startsWith(code + '.'));
    if (hit) return hit.ticker;
  } catch(e) {}
  return code + '.KS'; // 폴백
}

// ---- 티커 추가 ----
async function addTicker(ticker) {
  let raw = (ticker || document.getElementById('ticker-input').value.trim()).trim();
  // 순수 숫자면 한국 종목코드 → KRX에서 .KS/.KQ 해석
  ticker = /^\d{5,6}$/.test(raw) ? await resolveKrTicker(raw) : raw.toUpperCase();
  if (!ticker) return;
  const g = curGroup();
  if (!g) { showError('먼저 접속 코드로 로그인하세요'); openSyncDialog(); return; }
  // 폴더식: 국내장 그룹엔 국내 종목만, 해외장 그룹엔 해외 종목만. (즐겨찾기·빠른조회는 자유)
  if (!isSpecialGroup(g.id) && tickerMarket(ticker) !== groupMarket(g)) {
    const gm = groupMarket(g);
    showError(`${gm === 'kr' ? '국내장' : '해외장'} 그룹에는 ${gm === 'kr' ? '해외' : '국내'} 종목을 추가할 수 없어요. 상단에서 ${gm === 'kr' ? '해외장' : '국내장'}을 선택해 추가하세요.`);
    return;
  }
  if (g.tickers.includes(ticker)) { showError(`${ticker}은 이미 추가되어 있습니다`); return; }
  document.getElementById('ticker-input').value = '';
  document.getElementById('empty-state').style.display = 'none';

  // 현재 그룹에 추가하고 로딩 카드 표시
  g.tickers.push(ticker);
  stocks[ticker] = null;
  if (isSpecialGroup(g.id) && tickerMarket(ticker) !== selectedMarket) {
    // 즐겨찾기·빠른조회에 다른 시장 종목을 넣으면 화면에 안 보이므로 그 시장으로 전환.
    selectedMarket = tickerMarket(ticker);
    saveState();
    renderGroupBar();
    loadActiveGroup();
    return;
  }
  saveState();
  renderLoadingCard(ticker);
  fetchStock(ticker, true); // 방금 추가 → 잘못된 심볼이면 제거 허용
  fetchSignal(ticker);
}

// 일시적(=재시도하면 복구되는) 실패인지 판정한다.
// 레이트리밋(429)·서버오류(5xx)·네트워크/타임아웃(status 0)은 일시 오류로 보고
// 절대 종목을 삭제하지 않는다. (야후 "Too Many Requests"가 대표적)
function _isTransient(status, msg) {
  msg = msg || '';
  return status === 429 || status >= 500 || status === 0
    || /rate limit|too many requests|429|503|타임아웃|temporarily|일시/i.test(msg);
}

// 일시 오류로 비어 있는 카드를 지수 백오프로 자동 재시도한다(레이트리밋 해소되면 복구).
// 그룹에 아직 살아있는 종목만, 최대 4회까지. (loadActiveGroup이 매번 카운터를 초기화)
let _retryCount = {};
function scheduleRetry(ticker) {
  const n = (_retryCount[ticker] || 0) + 1;
  if (n > 4) return;
  _retryCount[ticker] = n;
  const delay = Math.min(2500 * 2 ** (n - 1), 20000); // 2.5s, 5s, 10s, 20s
  setTimeout(() => {
    const g = curGroup();
    if (!g || !g.tickers.includes(ticker)) return; // 사용자가 지운 종목은 재시도 안 함
    if (!stocks[ticker]) fetchStock(ticker);
    if (!signals[ticker]) fetchSignal(ticker);
  }, delay);
}

// 단일 티커 데이터 fetch → 캐시에 저장 후 렌더.
// isNew=true(사용자가 방금 추가): '진짜 잘못된 심볼'일 때만 그룹에서 제거.
// isNew=false(저장된 목록 로드): 어떤 실패에도 절대 자동 삭제하지 않는다(데이터 보호).
async function fetchStock(ticker, isNew = false) {
  setLoadingBar(30);
  let status = 0;
  try {
    const res = await apiFetch(`${API}/stock/${ticker}`);
    status = res.status;
    const json = await res.json();
    if (!json.success) throw new Error(json.error || '데이터 로드 실패');
    stocks[ticker] = json.data;
    setLoadingBar(100);
    persistCache();   // 성공값을 로컬에 저장(다음 콜드스타트 때 즉시 표시용)
    renderAll();
  } catch(e) {
    const msg = e.message || '';
    // 일시 오류이거나, 저장된 종목이면 → 절대 삭제하지 않고 보존 후 자동 재시도.
    if (_isTransient(status, msg) || !isNew) {
      console.warn(`[MarketEye] stock 보존(미삭제): ${ticker} — ${msg}`);
      scheduleRetry(ticker);
      setLoadingBar(0);
      renderAll();
      return;
    }
    // 여기까지 오면 '사용자가 방금 추가한 잘못된 심볼'만 해당 → 정리한다.
    const g = curGroup();
    g.tickers = g.tickers.filter(t => t !== ticker);
    delete stocks[ticker];
    saveState();
    showError(`${ticker}: ${msg}`);
    setLoadingBar(0);
    renderAll();
    if (!viewTickers(curGroup()).length) document.getElementById('empty-state').style.display = '';
  }
}

function quickAdd(t) { addTicker(t); }

// ---- 가격 자동 새로고침 (30초마다 가격·등락률만 갱신) ----
const REFRESH_SEC = 30;
let refreshTimer = null;
let countdown = REFRESH_SEC;

// 서버는 gunicorn 스레드 4개뿐인데 예전엔 30초마다 가격 7건을 '한꺼번에', 그것도
// 직전 회차가 안 끝났어도 또 쐈다. 브라우저가 타임아웃으로 포기한 요청도 서버는 끝까지
// 처리하므로 밀린 요청이 끝없이 쌓여 /sync·/health 까지 전부 타임아웃났다(2026-10 장애).
// → 직전 회차가 진행 중이면 건너뛰고, 동시 요청 수를 PRICE_POOL로 제한한다.
const PRICE_POOL = 2;
let pricesInFlight = false;
let groupLoadSeq = 0, groupLoading = false;   // 그룹 로드(주식·신호) 진행 중엔 가격 폴링 생략

async function refreshPrices() {
  const tickers = orderedTickers();
  if (!tickers.length || pricesInFlight || groupLoading) return;
  pricesInFlight = true;
  try { await _refreshPrices(tickers); } finally { pricesInFlight = false; }
}

async function _refreshPrices(tickers) {

  document.getElementById('last-updated').textContent = '새로고침 중...';
  document.getElementById('last-updated').style.color = 'var(--yellow)';

  await runPool(tickers, async ticker => {
    try {
      // 경량 엔드포인트: 가격·등락률만 (재무지표·히스토리는 유지)
      const res = await apiFetch(`${API}/price/${ticker}`);
      const json = await res.json();
      if (json.success && stocks[ticker]) Object.assign(stocks[ticker], json.data);
    } catch(e) {}
  }, PRICE_POOL);
  persistCache();   // 갱신된 최신 가격도 로컬 캐시에 반영

  const now = new Date();
  document.getElementById('last-updated').textContent =
    `${now.getHours().toString().padStart(2,'0')}:${now.getMinutes().toString().padStart(2,'0')} 기준`;
  document.getElementById('last-updated').style.color = 'var(--green)';

  if (activeTab === 'overview') renderCards();
}

function startRefreshLoop() {
  if (refreshTimer) clearInterval(refreshTimer);
  countdown = REFRESH_SEC;
  refreshTimer = setInterval(() => {
    if (document.hidden) return; // 백그라운드 탭에서는 폴링 정지
    countdown--;
    document.getElementById('refresh-countdown').textContent = countdown + 's';
    if (countdown <= 0) {
      countdown = REFRESH_SEC;
      if (activeTab === 'ranking') fetchRanking(true);
      else if (activeTab === 'paper') paperTick();
      else refreshPrices();
    }
  }, 1000);
}

function removeTicker(ticker) {
  const g = curGroup();
  g.tickers = g.tickers.filter(t => t !== ticker);
  delete stocks[ticker];
  saveState();
  renderAll();
  if (!viewTickers(g).length) document.getElementById('empty-state').style.display = '';
}

function clearAll() {
  const g = curGroup();
  if (!g) return;
  const shown = viewTickers(g);
  if (shown.length && !confirm('현재 그룹의 모든 종목을 삭제할까요?')) return;
  // 즐겨찾기·빠른조회는 지금 보이는(선택 시장) 종목만 지운다 — 다른 시장 종목 보존.
  g.tickers = g.tickers.filter(t => !shown.includes(t));
  stocks = {};
  saveState();
  renderAll();
  document.getElementById('empty-state').style.display = '';
}

// ---- 그룹 목록 로컬 스냅샷 (stale-while-revalidate) ────────────────────
// 종목(stocks/signals)은 직전 값을 로컬에 캐시해 즉시 표시하지만, 정작 "어떤
// 그룹에 어떤 종목이 있는지"는 캐시가 없어 매번 서버(Supabase) 응답을 기다려야
// 했다. 배포 직후(콜드스타트)엔 이 대기가 최대 150초까지 걸릴 수 있고, 그 동안
// groups가 비어있어 그룹 바·카드가 전혀 그려지지 않아 '무한 로딩'처럼 보였다.
// → 그룹 목록도 동일하게 로컬에 캐시해두고, 새로고침 시 캐시로 즉시 그려준 뒤
// 백그라운드에서 서버 최신값으로 갱신한다. 로그인 코드가 다르면(다른 사용자)
// 캐시를 신뢰하지 않도록 code를 함께 저장해 대조한다.
const _GROUPS_CACHE_KEY = 'marketeye_groups_cache_v1';
function persistGroupsCache() {
  if (!syncCode) return;
  try {
    const g = groups.filter(x => x.id !== QUICK_ID); // 빠른 조회는 임시 그룹이라 캐시 제외
    localStorage.setItem(_GROUPS_CACHE_KEY, JSON.stringify({ code: syncCode, groups: g, activeId, selectedMarket }));
  } catch (e) { /* 용량 초과·비활성 등은 무시(캐시는 부가기능) */ }
}
function hydrateGroupsFromCache() {
  try {
    const raw = localStorage.getItem(_GROUPS_CACHE_KEY);
    if (!raw) return false;
    const c = JSON.parse(raw);
    if (!c || c.code !== syncCode || !Array.isArray(c.groups) || !c.groups.length) return false;
    groups = c.groups;
    activeId = c.activeId;
    selectedMarket = c.selectedMarket === 'us' ? 'us' : 'kr';
    return true;
  } catch (e) { return false; }
}

// ---- 상태 저장/복원 (Supabase가 최종 저장소, 로컬은 캐시 용도) ----
// 로그인 코드(marketeye_sync_code)와 그룹 목록 스냅샷만 로컬에 보관한다.
// 서버(Supabase)가 항상 최종 진실 소스이며, 로컬 캐시는 새로고침 시 화면을
// 즉시 채우기 위한 부가 장치일 뿐이다.
function saveState() {
  persistGroupsCache(); // 로컬 스냅샷도 즉시 갱신 (다음 새로고침 때 무한 로딩 방지)
  pushSync(); // 로그인 코드가 있으면 서버에 저장 (디바운스)
}
function restoreState() {
  updateSyncUI();
  if (syncCode) {
    pullSync(true); // 서버에서 내 데이터 로드 (없으면 기본 그룹 생성)
  } else {
    requireLogin(); // 코드가 없으면 로그인 요구
  }
}

// ---- 로그인(개인 코드) + 서버 저장 ----
function updateSyncUI(status) {
  const st = document.getElementById('sync-status');
  const btn = document.getElementById('sync-btn');
  if (btn) btn.textContent = syncCode ? `👤 ${syncCode}` : '🔑 로그인';
  if (!st) return;
  if (status) { st.textContent = status; st.style.color = 'var(--yellow)'; return; }
  st.textContent = syncCode ? `로그인: ${syncCode}` : '로그아웃됨';
  st.style.color = 'var(--muted)';
}

// 로그인 코드가 없을 때 입력을 요구한다 (취소하면 로그아웃 상태 유지)
function requireLogin() {
  groups = [];
  activeId = null;
  stocks = {};
  renderGroupBar();
  loadActiveGroup();
  updateSyncUI('로그인이 필요합니다');
  openSyncDialog();
}

function openSyncDialog() {
  const v = prompt(
    '접속 코드를 입력하세요. (로그인)\n' +
    '같은 코드를 어느 기기(폰·PC)에서 입력하든 내 관심종목이 그대로 나타납니다.\n' +
    '※ 남이 추측하기 어려운 나만의 코드를 쓰세요. (비우고 확인하면 로그아웃)',
    syncCode || ''
  );
  if (v === null) return;
  const code = v.trim();
  if (code) {
    syncCode = code;
    localStorage.setItem('marketeye_sync_code', syncCode);
    paperReset();
    pullSync(true);
  } else {
    logout();
  }
}

function logout() {
  syncCode = '';
  localStorage.removeItem('marketeye_sync_code');
  paperReset();
  requireLogin();
}

// 서버 → 화면: 서버 데이터를 불러온다. 신규 코드(서버가 비었음)면 기본 그룹을 만들어 올린다.
async function pullSync(pushIfEmpty) {
  if (!syncCode) return;
  // 직전 그룹 스냅샷(같은 로그인 코드)이 있으면 서버 응답을 기다리지 않고 즉시
  // 화면부터 채운다 — 배포 직후 콜드스타트로 서버가 느려도 화면이 계속 비어
  // '무한 로딩'처럼 보이는 일을 막는다. 서버 응답이 오면 최신값으로 덮어쓴다.
  const hadCache = groups.length === 0 && hydrateGroupsFromCache();
  if (hadCache) {
    ensureFav();
    ensureQuick();
    migrateGroupMarkets();
    if (!groups.some(g => g.id === activeId)) activeId = (groups.find(g => !isSpecialGroup(g.id)) || groups[0]).id;
    renderGroupBar();
    loadActiveGroup();
  }
  updateSyncUI(hadCache ? '최신 데이터 동기화 중...' : '불러오는 중...');
  try {
    // Render 콜드 스타트(서버 깨우기, 최대 ~60초) 대응: 이 첫 로드 요청만 타임아웃을
    // 75초로 늘리고, 깨우는 도중 첫 시도가 끊기면 1회 재시도한다. (총 2회 시도)
    let res;
    for (let attempt = 0; attempt <= 1; attempt++) {
      try {
        res = await apiFetch(`${API}/sync/${encodeURIComponent(syncCode)}`, {}, 75000);
        break;
      } catch (e) {
        if (attempt === 0) { updateSyncUI(hadCache ? '최신 데이터 동기화 중... (서버 깨우는 중)' : '서버 깨우는 중... (최초 접속은 시간이 걸릴 수 있어요)'); continue; }
        throw e;
      }
    }
    const json = await res.json();
    if (!json.success) throw new Error(json.error || '불러오기 실패');
    if (json.data && Array.isArray(json.data.groups) && json.data.groups.length) {
      groups = json.data.groups;
      activeId = groups.some(g => g.id === json.data.activeId) ? json.data.activeId : groups[0].id;
    } else if (hadCache && groups.some(g => g.id !== QUICK_ID && (!isSpecialGroup(g.id) || g.tickers.length))) {
      // 서버가 비어 있는데(복구된 DB·일시 오류 등) 이 기기엔 같은 코드의 그룹 스냅샷이
      // 있다 → 기본 그룹으로 덮어써 관심종목을 날리지 말고, 로컬 스냅샷을 서버에 복원한다.
      console.warn('[MarketEye] 서버 데이터 없음 → 로컬 그룹 스냅샷을 서버에 복원');
      await pushSyncNow();
    } else {
      // 서버에 데이터가 없는 신규 코드 → 기본 그룹 생성 (국내장)
      groups = [{ id: genId(), name: '내 관심종목', tickers: [], market: 'kr' }];
      activeId = groups[0].id;
      ensureFav();
      if (pushIfEmpty) await pushSyncNow();
    }
    ensureFav();
    ensureQuick();
    migrateGroupMarkets();  // 구버전 그룹에 market 필드 채움
    // 저장된 선택 시장 복원 (기본 국내장)
    // (서버가 비어 로컬 스냅샷을 복원한 경우엔 지금 선택된 시장을 유지)
    if (json.data) selectedMarket = json.data.selectedMarket === 'us' ? 'us' : 'kr';
    if (!groups.some(g => g.id === activeId)) activeId = (groups.find(g => !isSpecialGroup(g.id)) || groups[0]).id;
    // 활성 그룹이 실제 그룹이면 그 시장에 맞춰 선택 시장을 정렬(활성 그룹이 안 보이는 일 방지).
    const _ag = groups.find(g => g.id === activeId);
    if (_ag && !isSpecialGroup(_ag.id)) selectedMarket = groupMarket(_ag);
    persistGroupsCache(); // 최신 서버 데이터로 로컬 스냅샷 갱신
    renderGroupBar();
    loadActiveGroup();
    updateSyncUI();
  } catch(e) {
    if (hadCache) {
      // 캐시로 이미 화면을 채워둔 상태 — 무한 로딩은 아니므로 조용히 동기화 실패만 알린다.
      updateSyncUI('동기화 실패 (직전 데이터 표시 중)');
    } else {
      updateSyncUI('불러오기 실패');
      showError('불러오기 실패: ' + e.message);
    }
  }
}

// 로컬 → 서버 (디바운스)
let syncTimer = null;
function pushSync() {
  if (!syncCode) return;
  clearTimeout(syncTimer);
  syncTimer = setTimeout(pushSyncNow, 800);
}
async function pushSyncNow() {
  if (!syncCode) return;
  try {
    updateSyncUI('저장 중...');
    // 빠른 조회 그룹은 임시이므로 서버에 저장하지 않는다.
    const persistGroups = groups.filter(g => g.id !== QUICK_ID);
    const persistActive = activeId === QUICK_ID
      ? (persistGroups.find(g => g.id !== FAV_ID) || persistGroups[0] || {}).id
      : activeId;
    const res = await apiFetch(`${API}/sync/${encodeURIComponent(syncCode)}`, {
      method: 'PUT',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ data: { groups: persistGroups, activeId: persistActive, selectedMarket } }),
    });
    const json = await res.json();
    if (!json.success) throw new Error(json.error || '저장 실패');
    updateSyncUI();
  } catch(e) {
    updateSyncUI('저장 실패');
  }
}

// 동시 실행 개수를 limit개로 제한하는 작업 풀. items를 worker로 처리하되 항상
// 최대 limit개만 '동시에' 진행한다(하나 끝나면 다음 것을 당겨온다). 시차(stagger)와
// 달리 콜드스타트로 요청이 오래 걸려도 서버에 몰리는 최대 동시 요청 수가 고정된다.
// worker는 예외를 자체 처리하는 게 원칙이나, 혹시 던져도 풀이 멈추지 않게 감싼다.
async function runPool(items, worker, limit) {
  let idx = 0;
  async function lane() {
    while (idx < items.length) {
      const cur = idx++;
      try { await worker(items[cur], cur); } catch (e) {}
    }
  }
  const lanes = [];
  for (let i = 0; i < Math.min(limit, items.length); i++) lanes.push(lane());
  await Promise.all(lanes);
}

// 현재 그룹의 종목 데이터를 모두 불러옴
// ── 직전 값 로컬 캐시 (stale-while-revalidate) ──────────────────────────
// 배포/재접속 시 서버 인메모리 캐시가 비어(콜드스타트) 첫 요청이 느리거나 실패하면
// 카드가 무한 '로딩 중'에 갇혔다. 마지막으로 성공한 stocks/signals를 localStorage에
// 저장해두고, 로드 즉시 그 값으로 카드를 채운 뒤 백그라운드에서 갱신한다. 서버가
// 콜드여도 사용자는 직전 데이터를 바로 본다(무한 스피너 원천 차단). 순수 클라이언트.
const _CACHE_KEY = 'marketeye_data_cache_v1';
let _persistTimer = null;
function persistCache() {
  clearTimeout(_persistTimer);
  _persistTimer = setTimeout(() => {
    try {
      const s = {}, g = {};
      for (const k in stocks) if (stocks[k]) s[k] = stocks[k];   // null(로딩중) 제외
      for (const k in signals) if (signals[k]) g[k] = signals[k];
      localStorage.setItem(_CACHE_KEY, JSON.stringify({ ts: Date.now(), stocks: s, signals: g }));
    } catch (e) { /* 용량 초과·비활성 등은 무시(캐시는 부가기능) */ }
  }, 1200);
}
function hydrateFromCache(tickers) {
  let hit = 0;
  try {
    const raw = localStorage.getItem(_CACHE_KEY);
    if (!raw) return 0;
    const c = JSON.parse(raw) || {};
    tickers.forEach(t => {
      if (!stocks[t] && c.stocks && c.stocks[t]) { stocks[t] = c.stocks[t]; hit++; }
      if (!signals[t] && c.signals && c.signals[t]) { signals[t] = c.signals[t]; }
    });
    if (hit) console.log(`[MarketEye] 💾 캐시 복원: ${hit}종목 즉시 표시(백그라운드 갱신 중)`);
  } catch (e) { /* 손상된 캐시는 무시 */ }
  return hit;
}
// 무한로딩 카드의 '다시 시도' 버튼 → 재시도 예산 리셋 후 재요청
function retryTicker(ticker) {
  _retryCount[ticker] = 0;
  if (!stocks[ticker]) fetchStock(ticker);
  if (!signals[ticker]) fetchSignal(ticker);
  renderAll();
}

function loadActiveGroup() {
  stocks = {};
  signals = {};
  _retryCount = {}; // 새 로드 → 재시도 예산 초기화
  const g = curGroup();
  const tickers = viewTickers(g).slice();
  document.getElementById('empty-state').style.display = tickers.length ? 'none' : '';
  tickers.forEach(t => { stocks[t] = null; });
  hydrateFromCache(tickers);   // 직전 값으로 즉시 채움 → 무한 '로딩 중' 방지
  renderAll();
  // 한꺼번에 쏟아내면 콜드스타트·야후 레이트리밋(429) 시 요청이 몰려 전부 타임아웃난다.
  // 시차 대신 '동시 요청 수'를 고정(풀)해 서버 부하를 낮춘다. 주식(가벼움) 먼저 최대
  // 3개 동시 → 모두 끝난 뒤 신호(무거움) 최대 2개 동시. fetchStock/Signal은 예외를
  // 자체 처리·백그라운드 재시도하므로 풀이 막히지 않는다(동작 의미는 기존과 동일).
  const mySeq = ++groupLoadSeq;
  groupLoading = true;
  (async () => {
   try {
    const t0 = performance.now();
    console.log(`[MarketEye] ⏳ 그룹 로드 시작: ${tickers.length}종목 [${tickers.join(', ')}]`);
    await runPool(tickers, t => fetchStock(t), 3);
    const okS = tickers.filter(t => stocks[t]).length;
    console.log(`[MarketEye] 📊 주식 ${okS}/${tickers.length} 성공${okS < tickers.length ? ` · 실패 ${tickers.filter(t => !stocks[t]).join(', ')}` : ''} (${Math.round(performance.now() - t0)}ms)`);
    await runPool(tickers, t => fetchSignal(t), 2);
    const okG = tickers.filter(t => signals[t]).length;
    console.log(`[MarketEye] 📊 신호 ${okG}/${tickers.length} 성공${okG < tickers.length ? ` · 실패 ${tickers.filter(t => !signals[t]).join(', ')}` : ''} · 총 ${Math.round(performance.now() - t0)}ms`);
    // 진단 요약: 대량 타임아웃이면 서버-야후 구간 문제일 가능성이 큼(서버 Render 로그 확인)
    if (okS < tickers.length || okG < tickers.length) {
      console.warn('[MarketEye] ⚠ 일부 로드 실패 — 반복되면 Render 서버 로그에서 "야후 …s 무응답/느림" 확인. 한국주는 네이버 폴백으로 시세는 떠야 정상.');
    }
   } finally {
    if (mySeq === groupLoadSeq) groupLoading = false;   // 더 최근 로드가 시작됐으면 그쪽이 해제
   }
  })();
}

// 신호는 첫 콜드스타트에서 2년 일봉+재무 조회로 가장 무겁다 → 기본 30초로는 첫 파도가
// 끊기기 쉬워 45초로 여유를 준다(apiFetch의 timeoutMs 오버라이드 사용, 타 요청엔 무영향).
const SIGNAL_TIMEOUT_MS = 45000;
async function fetchSignal(ticker) {
  let status = 0;
  try {
    const res = await apiFetch(`${API}/signal/${encodeURIComponent(ticker)}`, {}, SIGNAL_TIMEOUT_MS);
    status = res.status;
    const json = await res.json();
    if (json.success) {
      signals[ticker] = json.data;
      persistCache();   // 성공 신호를 로컬에 저장(콜드스타트 때 즉시 표시용)
      // 개요 탭 카드 배지 갱신
      if (activeTab === 'overview') updateSignalBadge(ticker, json.data);
      // 신호 탭이 열려 있으면 재렌더
      if (activeTab === 'signal') renderSignalTab();
    } else {
      const msg = json.error || '알 수 없음';
      console.warn(`[MarketEye] signal 실패: ${ticker} — ${msg}`);
      // 레이트리밋 등 일시 오류면 점수만 잠시 비고, 잠시 후 자동 재시도된다.
      if (_isTransient(status, msg)) scheduleRetry(ticker);
    }
  } catch(e) {
    // 과거엔 여기서 에러를 통째로 삼켜, 렌더 예외가 나도 카드가 '분석 중'에
    // 영원히 멈춰 콘솔에 단서조차 없었다. 이제는 반드시 남긴다.
    console.error(`[MarketEye] fetchSignal 예외: ${ticker}`, e);
    if (_isTransient(status, e.message)) scheduleRetry(ticker);
  }
}

// 점수 → 등급 라벨 (기술/펀더멘털 각각 독립 평가)
function scoreLabel(s) {
  if (s >= 68) return { text: '매수 고려', cls: 'buy',  emoji: '✅' };
  if (s >= 48) return { text: '관망',      cls: 'wait', emoji: '⏳' };
  return            { text: '주의',      cls: 'warn', emoji: '⚠️' };
}
function scoreColor(s) {
  if (s >= 68) return 'var(--green)';
  if (s >= 48) return 'var(--yellow)';
  return 'var(--red)';
}

// 카드 innerHTML에 직접 넣는 배지 — 기술/펀더멘털 따로 표시 (카드 재렌더에도 유지됨)
function signalBadgeHtml(ticker) {
  const sig = signals[ticker];
  if (!sig) return '';
  const t = scoreLabel(sig.tech_score);
  const f = scoreLabel(sig.fund_score);
  const c = sig.composite;
  const compBadge = c
    ? `<div class="signal-badge ${scoreLabel(c.score).cls}" style="margin-top:0;font-weight:700">🎯 종합 ${c.score} ${c.verdict_emoji}</div>`
    : '';
  // ETF(지수·자산)는 개별 재무가 없어 '가치' 대신 ETF 칩을 표시(오해 방지)
  const fundOrEtfBadge = sig.is_etf
    ? `<div class="signal-badge" style="margin-top:0;background:transparent;border:1px solid var(--muted);color:var(--muted)">🧺 ETF</div>`
    : `<div class="signal-badge ${f.cls}" style="margin-top:0">💰 가치 ${sig.fund_score} ${f.emoji}</div>`;
  return `<div style="display:flex;gap:6px;flex-wrap:wrap;margin-top:10px">
    ${compBadge}
    <div class="signal-badge ${t.cls}" style="margin-top:0">📈 차트 ${sig.tech_score} ${t.emoji}</div>
    ${fundOrEtfBadge}
  </div>`;
}

// 이미 그려진 카드에 배지만 갱신 (신호가 가격보다 늦게 도착한 경우)
function updateSignalBadge(ticker, sig) {
  const card = document.getElementById(`card-${ticker}`);
  if (!card || card.querySelector('.signal-badge')) return;
  card.insertAdjacentHTML('beforeend', signalBadgeHtml(ticker));
}

function renderSignalTab() {
  const section = document.getElementById('signal-section');
  const tickers = orderedTickers();
  if (!tickers.length) {
    section.innerHTML = '<p class="signal-loading">종목을 추가하면 진입 신호가 표시됩니다.</p>';
    return;
  }
  section.innerHTML = `<div class="signal-section-grid">${tickers.map(t => {
    // 한 종목 렌더가 예외로 터져도 나머지 카드까지 같이 사라지지 않게 격리한다.
    try { return renderSignalCard(t); }
    catch (e) {
      console.error(`[MarketEye] 진입신호 렌더 실패: ${t}`, e);
      return `<div class="signal-card">
        <div class="signal-name">${esc((stocks[t] && stocks[t].name) || t)}</div>
        <div class="signal-ticker-label">${esc(t)}</div>
        <div class="signal-loading" style="padding:20px 0;color:var(--red)">표시 중 오류: ${esc(e.message)}</div>
      </div>`;
    }
  }).join('')}</div>`;
}

// opt: 랭킹 옆 패널처럼 현재 그룹 밖 종목을 그릴 때 { sig, name, currency, btId }로 덮어쓴다.
function renderSignalCard(ticker, opt = {}) {
  const sig = opt.sig || signals[ticker];
  const name = opt.name || (stocks[ticker] && stocks[ticker].name) || ticker;
  const btId = opt.btId || `bt-${ticker}`;
  if (!sig) {
    return `<div class="signal-card">
      <div class="signal-name">${esc(name)}</div>
      <div class="signal-ticker-label">${esc(ticker)}</div>
      <div class="signal-loading" style="padding:20px 0">분석 중...</div>
    </div>`;
  }
  const ind = sig.indicators;
  const fund = sig.fundamentals;

  function indItem(key, val) {
    return `<div class="signal-ind-item"><div class="signal-ind-key">${key}</div><div class="signal-ind-val">${val}</div></div>`;
  }

  // 한 분석 축(기술/펀더멘털)을 독립 블록으로 렌더
  function block(title, score, itemsHtml) {
    const lb = scoreLabel(score);
    return `<div class="signal-block">
      <div class="signal-block-head">
        <span class="signal-block-title">${title}</span>
        <span class="signal-block-score">
          <span class="signal-badge ${lb.cls}" style="margin-top:0">${lb.emoji} ${lb.text}</span>
          <b style="color:${scoreColor(score)};font-size:18px;margin-left:6px">${score}</b><span style="color:var(--muted);font-size:11px">/100</span>
        </span>
      </div>
      <div class="signal-indicators">${itemsHtml}</div>
    </div>`;
  }

  const maStatus = (() => {
    if (!ind.ma20 || !ind.ma60) return '-';
    if (ind.price > ind.ma20 && ind.ma20 > ind.ma60) return '정배열 ↑';
    if (ind.price < ind.ma20 && ind.ma20 < ind.ma60) return '역배열 ↓';
    return '혼조';
  })();

  // 추세(regime) 칩: 매수신호의 대전제 — 색/이모지로 한눈에
  const REGIME = {
    strong_up:   { emoji: '🚀', color: 'var(--green)'  },
    up:          { emoji: '📈', color: 'var(--green)'  },
    range:       { emoji: '↔️', color: 'var(--yellow)' },
    down:        { emoji: '📉', color: 'var(--red)'    },
    strong_down: { emoji: '⛔', color: 'var(--red)'    },
  };
  const rg = REGIME[sig.regime] || REGIME.range;

  const volTxt = ind.vol_ratio >= 1.8 ? `${ind.vol_ratio}배 🔥급증`
               : ind.vol_ratio >= 1.1 ? `${ind.vol_ratio}배 ↑`
               : ind.vol_ratio < 0.8  ? `${ind.vol_ratio}배 한산`
               : '평소 수준';

  const rsTxt = ind.rs_60 != null
    ? `${ind.rs_60 > 0 ? '+' : ''}${ind.rs_60}%p ${ind.rs_60 > 3 ? '💪강세' : ind.rs_60 < -5 ? '🔻약세' : ''}`
    : '-';

  // 참고 지표(점수 미반영, 판단 보조) — ADX(추세강도)·CMF(자금흐름)·추세품질(R²)·변동성 응축
  const adxTxt = ind.adx != null
    ? `${ind.adx} ${ind.adx >= 25 ? (ind.plus_di > ind.minus_di ? '💪추세강' : '🔻하방강') : ind.adx < 20 ? '약함(횡보)' : '보통'}`
    : '-';
  const cmfTxt = ind.cmf != null
    ? `${ind.cmf > 0 ? '+' : ''}${ind.cmf} ${ind.cmf > 0.1 ? '🟢유입' : ind.cmf < -0.1 ? '🔴유출' : '중립'}`
    : '-';
  const sqzTxt = ind.squeeze_fired ? '💥 분출 시작'
               : ind.squeeze_on ? '🌀 응축(대기)'
               : '정상';
  const r2Txt = ind.trend_r2 != null
    ? `${ind.trend_r2} ${ind.trend_r2 >= 0.7 ? '매끈✨' : ind.trend_r2 < 0.3 ? '불규칙' : ''}`
    : '-';

  const techItems =
    indItem('추세', `<span style="color:${rg.color}">${rg.emoji} ${esc(sig.regime_label || '-')}</span>`) +
    indItem('추세강도 (ADX)', adxTxt) +
    indItem('RSI (14)', `${ind.rsi} ${ind.rsi < 30 ? '📉 과매도' : ind.rsi > 70 ? '📈 과매수' : ''}`) +
    indItem('MACD', ind.macd_cross ? '🔔 골든크로스' : ind.macd > ind.macd_signal ? '상승세' : '하락세') +
    indItem('이동평균', maStatus) +
    indItem('볼린저 위치', `${ind.bb_pct}% ${ind.bb_pct < 25 ? '🔵 하단' : ind.bb_pct > 75 ? '🔴 상단' : '중립'}`) +
    indItem('거래량', `${volTxt}${ind.bull_div ? ' · ✨다이버전스' : ''}`) +
    indItem('자금흐름 (CMF)', cmfTxt) +
    indItem('변동성 응축', sqzTxt) +
    indItem('추세 품질 (R²)', r2Txt) +
    indItem('시장 상대강도', rsTxt) +
    indItem('가격 구조', esc(ind.structure || '-'));

  // 근거 문장 — 차트를 몰라도 "왜 이 점수인지" 읽히게
  const reasonsHtml = (sig.reasons && sig.reasons.length)
    ? `<ul style="margin:10px 0 0;padding-left:18px;font-size:12px;color:var(--muted);line-height:1.7">
        ${sig.reasons.map(r => `<li>${esc(r)}</li>`).join('')}
       </ul>`
    : '';

  // 매매 플랜 (ATR 기반 손절·목표·손익비) — 진입만큼 중요한 청산/리스크
  const plan = sig.plan || {};
  const cur = opt.currency || (stocks[ticker] && stocks[ticker].currency) || 'USD';
  const rrColor = plan.rr >= 2 ? 'var(--green)' : plan.rr >= 1 ? 'var(--yellow)' : 'var(--red)';
  const planHtml = (plan.stop != null && plan.target != null)
    ? `<div style="margin-top:12px;padding:10px;background:var(--surface2);border-radius:8px;font-size:12px">
        <div style="font-weight:700;margin-bottom:8px;color:var(--text)">🎯 매매 플랜 <span style="color:var(--muted);font-weight:400;font-size:10px">ATR 기반</span></div>
        <div style="display:grid;grid-template-columns:1fr 1fr 1fr;gap:6px;text-align:center">
          <div><div style="color:var(--muted);font-size:10px">진입</div><div>${fmt(plan.entry, cur)}</div></div>
          <div><div style="color:var(--muted);font-size:10px">손절</div><div style="color:var(--red)">${fmt(plan.stop, cur)} <span style="font-size:10px">${plan.stop_pct != null ? plan.stop_pct + '%' : ''}</span></div></div>
          <div><div style="color:var(--muted);font-size:10px">목표</div><div style="color:var(--green)">${fmt(plan.target, cur)} <span style="font-size:10px">+${plan.target_pct != null ? plan.target_pct + '%' : ''}</span></div></div>
        </div>
        <div style="text-align:center;margin-top:8px;color:var(--muted)">손익비 <b style="color:${rrColor}">${plan.rr != null ? plan.rr + ' : 1' : '-'}</b></div>
        ${plan.size_per_1pct != null ? `<div style="text-align:center;margin-top:6px;color:var(--muted);font-size:10px">자본 1% 리스크 기준 권장 비중 <b style="color:var(--text)">${plan.size_per_1pct > 100 ? '100%+' : plan.size_per_1pct + '%'}</b> · 주당 위험 ${fmt(plan.risk_per_share, cur)}</div>` : ''}
      </div>`
    : '';

  // 추천 매수존 (퀀트 confluence) — 거래량프로파일·VWAP·피보·이동평균·지지선이 겹치는 고확률 구간
  const bz = sig.buy_zone;
  const bzColor = bz ? (bz.caution ? 'var(--red)' : bz.strength_label === '강함' ? 'var(--green)' : bz.strength_label === '보통' ? 'var(--yellow)' : 'var(--muted)') : '';
  // 거래량프로파일·VWAP 참고선 (있는 것만 표시)
  const bzRefs = bz ? [
    bz.poc != null ? `POC ${fmt(bz.poc, cur)}` : '',
    (bz.val != null && bz.vah != null) ? `밸류 ${fmt(bz.val, cur)}~${fmt(bz.vah, cur)}` : '',
    bz.avwap != null ? `VWAP ${fmt(bz.avwap, cur)}` : '',
  ].filter(Boolean).join(' · ') : '';
  const buyZoneHtml = bz
    ? `<div style="margin-top:12px;padding:10px;background:var(--surface2);border-radius:8px;font-size:12px;border:1px solid ${bzColor}">
        <div style="font-weight:700;margin-bottom:8px;color:var(--text)">🛒 추천 매수존 <span style="color:var(--muted);font-weight:400;font-size:10px">퀀트 다기법 합의(confluence)</span>
          <span style="float:right;color:${bzColor};font-weight:700">${bz.caution ? '⚠ ' : ''}${bz.strength_label} · ${bz.methods.length}기법</span></div>
        <div style="text-align:center;font-size:16px;font-weight:700;color:var(--text)">${fmt(bz.low, cur)} ~ ${fmt(bz.high, cur)}</div>
        <div style="text-align:center;margin-top:4px;color:var(--muted)">대표 진입가 <b style="color:var(--text)">${fmt(bz.entry, cur)}</b> · ${bz.in_zone ? '<span style="color:var(--green)">현재가 매수존 진입 ✓</span>' : `현재가 대비 <b style="color:var(--text)">${bz.dist_pct > 0 ? '+' : ''}${bz.dist_pct}%</b>`}</div>
        <div style="margin-top:8px;display:flex;gap:4px;flex-wrap:wrap;justify-content:center">
          ${bz.methods.map(mm => `<span style="font-size:10px;padding:2px 7px;background:var(--surface);border-radius:10px;color:var(--muted)">${esc(mm)}</span>`).join('')}
        </div>
        ${bzRefs ? `<div style="text-align:center;margin-top:6px;color:var(--muted);font-size:10px">${bzRefs}</div>` : ''}
        ${bz.note ? `<div style="text-align:center;margin-top:6px;color:${bz.caution ? 'var(--red)' : 'var(--muted)'};font-size:11px">${bz.caution ? '⚠ ' : ''}${esc(bz.note)}</div>` : ''}
      </div>`
    : '';

  // 5대 축 점수 막대 + 확장 지표 + 근거 (전문가형 펀더멘털)
  const m = (fund && fund.metrics) || {};
  const pil = (fund && fund.pillars) || {};
  const PILLAR_LABELS = { valuation:'밸류에이션', profitability:'수익성·질', growth:'성장성', health:'재무건전성', cashflow:'현금흐름' };
  const pillarBars = Object.keys(PILLAR_LABELS).map(k => {
    const v = pil[k];
    const col = v == null ? 'var(--muted)' : scoreColor(v);
    return `<div class="signal-bar-row">
      <span class="signal-bar-label">${PILLAR_LABELS[k]}</span>
      <span class="signal-bar-track"><span class="signal-bar-fill" style="width:${v == null ? 0 : v}%;background:${col}"></span></span>
      <span class="signal-bar-val">${v == null ? '-' : v}</span>
    </div>`;
  }).join('');

  const fundItems =
    indItem('PER', m.per != null ? m.per.toFixed(1)+'x' : '-') +
    indItem('PBR', m.pbr != null ? m.pbr.toFixed(2)+'x' : '-') +
    indItem('PEG', m.peg != null ? m.peg.toFixed(2) : '-') +
    indItem('PSR', m.psr != null ? m.psr.toFixed(2)+'x' : '-') +
    indItem('EV/EBITDA', m.evEbitda != null ? m.evEbitda.toFixed(1) : '-') +
    indItem('ROE', m.roe != null ? (m.roe*100).toFixed(1)+'%' : '-') +
    indItem('영업이익률', m.operatingMargin != null ? (m.operatingMargin*100).toFixed(1)+'%' : '-') +
    indItem('매출성장', m.revenueGrowth != null ? (m.revenueGrowth*100).toFixed(1)+'%' : '-') +
    indItem('부채비율', m.debtToEquity != null ? m.debtToEquity.toFixed(0)+'%' : '-') +
    indItem('FCF마진', m.fcfMargin != null ? m.fcfMargin+'%' : '-');

  const fundReasonsHtml = (fund && fund.reasons && fund.reasons.length)
    ? `<ul style="margin:8px 0 0;padding-left:18px;font-size:12px;color:var(--muted);line-height:1.7">
        ${fund.reasons.map(r => `<li>${esc(r)}</li>`).join('')}
       </ul>`
    : '';

  // ETF 개요 블록 — 지수·자산 ETF는 개별 재무 대신 운용보수·AUM·분배율·기간수익률·
  // 낙폭·이격도가 핵심 판단 재료다. (백엔드 sig.etf, 값은 모두 '퍼센트 숫자'로 정규화됨)
  const etf = sig.etf;
  const etfBlock = (sig.is_etf && etf) ? (() => {
    const row = (k, v) => (v == null || v === '') ? '' : indItem(k, v);
    const signed = (v, d = 1) => v == null ? null
      : `<span style="color:${v >= 0 ? 'var(--green)' : 'var(--red)'}">${v > 0 ? '+' : ''}${v.toFixed(d)}%</span>`;
