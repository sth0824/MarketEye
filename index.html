      row('순자산 (AUM)', etf.aum != null ? '$' + bigNum(etf.aum) : null) +
      row('분배율', etf.yield != null ? etf.yield.toFixed(2) + '%' : null) +
      row('카테고리', etf.category ? esc(etf.category) : null) +
      row('운용사', etf.fundFamily ? esc(etf.fundFamily) : null) +
      row('베타', etf.beta != null ? etf.beta.toFixed(2) : null) +
      row('YTD 수익률', signed(etf.ytdReturn)) +
      row('3년 연평균', signed(etf.threeYearReturn)) +
      row('5년 연평균', signed(etf.fiveYearReturn)) +
      row('52주 고점 대비', signed(etf.drawdownFromHigh)) +
      row('200일선 이격도', signed(etf.ma200Gap));
    return `<div class="signal-block">
      <div class="signal-block-head">
        <span class="signal-block-title">🧺 ETF 개요 <span style="color:var(--muted);font-weight:400;font-size:10px">지수·자산 ETF 핵심 지표</span></span>
      </div>
      <div class="signal-indicators">${items}</div>
      <div style="margin-top:8px;font-size:11px;color:var(--muted);line-height:1.6">💡 광범위 분산 지수 ETF는 개별 재무(PER·ROE)보다 <b>운용보수·추세·낙폭</b>이 핵심입니다. 장기 우상향 지수는 타이밍보다 <b>적립식(DCA)</b>이 정석이에요.</div>
    </div>`;
  })() : '';

  const lbF = scoreLabel(sig.fund_score);
  const fundBlock = `<div class="signal-block">
    <div class="signal-block-head">
      <span class="signal-block-title">💰 펀더멘털 (가치)</span>
      <span class="signal-block-score">
        <span class="signal-badge ${lbF.cls}" style="margin-top:0">${lbF.emoji} ${lbF.text}</span>
        <b style="color:${scoreColor(sig.fund_score)};font-size:18px;margin-left:6px">${sig.fund_score}</b><span style="color:var(--muted);font-size:11px">/100</span>
      </span>
    </div>
    <div class="signal-bars">${pillarBars}</div>
    <div class="signal-indicators">${fundItems}</div>
    ${fundReasonsHtml}
  </div>`;

  // 전문가식 종합 점수 — 차트·가치를 관계까지 고려해 합성한 '진입 판정'
  const comp = sig.composite;
  const compHtml = comp ? (() => {
    const col = scoreColor(comp.score);
    return `<div class="signal-block" style="border:1px solid ${col};background:linear-gradient(135deg,var(--surface2),transparent)">
      <div class="signal-block-head">
        <span class="signal-block-title">🎯 종합 진입 점수 <span style="color:var(--muted);font-weight:400;font-size:10px">${sig.is_etf ? '차트·추세 기반' : '차트·가치 합성'}</span></span>
        <span class="signal-block-score">
          <span class="signal-badge" style="margin-top:0;background:${col};color:#0b0e14;font-weight:700">${comp.verdict_emoji} ${comp.verdict_label}</span>
          <b style="color:${col};font-size:26px;margin-left:8px">${comp.score}</b><span style="color:var(--muted);font-size:11px">/100</span>
        </span>
      </div>
      <div style="display:flex;gap:10px;align-items:center;margin-top:8px;font-size:12px;color:var(--muted);flex-wrap:wrap">
        <span>📈 차트 <b style="color:${scoreColor(sig.tech_score)}">${sig.tech_score}</b></span>
        ${sig.is_etf
          ? `<span style="opacity:.7">🧺 지수 ETF — 가치 점수 미적용</span>`
          : `<span style="opacity:.5">×</span><span>💰 가치 <b style="color:${scoreColor(sig.fund_score)}">${sig.fund_score}</b></span>`}
        ${comp.confidence_label ? `<span style="margin-left:auto">신뢰도 <b>${comp.confidence_label}</b></span>` : ''}
      </div>
      <div style="margin-top:8px;font-size:12px;color:var(--text);line-height:1.6">💡 ${esc(comp.why)}</div>
    </div>`;
  })() : '';

  return `<div class="signal-card">
    <div class="signal-card-header">
      <div>
        <div class="signal-name">${esc(name)}</div>
        <div class="signal-ticker-label">${esc(ticker)}</div>
      </div>
      <span class="signal-badge" style="margin-top:0;background:transparent;border:1px solid ${rg.color};color:${rg.color}">${rg.emoji} ${esc(sig.regime_label || '')}</span>
    </div>
    ${compHtml}
    ${block('📈 기술적 분석 (차트)', sig.tech_score, techItems)}
    ${planHtml}
    ${buyZoneHtml}
    ${reasonsHtml}
    <div style="margin-top:12px">
      <div style="display:flex;gap:6px">
        <button class="secondary" style="font-size:12px;padding:6px 12px;flex:1" onclick="runBacktest('${ticker}', '${btId}')">📊 이 전략 5년 백테스트</button>
        <button class="secondary" style="font-size:12px;padding:6px 12px;flex:1" onclick="openPaperOrder('${ticker}')">💼 모의투자 주문</button>
      </div>
      <div id="${btId}" style="margin-top:8px"></div>
    </div>
    ${sig.is_etf ? etfBlock : fundBlock}
  </div>`;
}

// 점수 구간별 미래수익 검증 표 — 막대는 '기준선 초과수익(excess)'을 표시한다.
// 절대수익은 강세 종목이면 다 +라 무의미 → '아무 날이나 산 평균(기준선)'을 얼마나
// 넘었나가 진짜 변별력. excess가 0 근처면 그 점수는 의미 없다는 뜻.
function bucketHtml(d) {
  const bks = d.score_buckets;
  if (!bks || !bks.length) return '';
  const useEx = bks.some(b => b.excess != null);   // 신버전(excess) 우선, 없으면 절대수익 폴백
  const valOf = b => (useEx ? b.excess : b.avg_fwd);
  const max = Math.max(1, ...bks.map(b => Math.abs(valOf(b) || 0)));
  const rows = bks.map(b => {
    if (!b.n) return `<div class="signal-bar-row" style="opacity:.4"><span class="signal-bar-label">${b.range}점</span><span class="signal-bar-track"></span><span class="signal-bar-val">표본없음</span></div>`;
    const val = valOf(b) || 0;
    const pos = val >= 0;
    const w = Math.round(Math.abs(val) / max * 100);
    const col = pos ? 'var(--green)' : 'var(--red)';
    const tip = `표본 ${b.n}개 · 평균 ${b.avg_fwd >= 0 ? '+' : ''}${b.avg_fwd}% · 승률 ${b.win_rate}%`;
    return `<div class="signal-bar-row" title="${tip}">
      <span class="signal-bar-label">${b.range}점</span>
      <span class="signal-bar-track"><span class="signal-bar-fill" style="width:${w}%;background:${col}"></span></span>
      <span class="signal-bar-val" style="color:${col}">${pos ? '+' : ''}${val}%</span>
    </div>`;
  }).join('');
  const mono = d.monotonic != null
    ? `<span style="color:${d.monotonic >= 0.67 ? 'var(--green)' : d.monotonic >= 0.5 ? 'var(--yellow)' : 'var(--red)'}">단조성 ${Math.round(d.monotonic * 100)}%</span>`
    : '';
  const baseLine = (useEx && d.base_fwd != null)
    ? `<div style="color:var(--muted);font-size:10px;margin-bottom:6px">📏 기준선(아무 날이나 매수): <b style="color:var(--text)">${d.base_fwd >= 0 ? '+' : ''}${d.base_fwd}%</b> · 막대=<b>기준선 초과분</b> (0 근처면 점수 변별력 없음)</div>`
    : '';
  const label = useEx ? '미래 20일 <b>초과수익</b>(기준선 대비)' : '미래 20일 수익';
  return `<div style="margin-top:10px;padding-top:8px;border-top:1px solid var(--border)">
    <div style="font-weight:700;margin-bottom:6px">🔬 점수 구간별 ${label} ${mono}
      <span style="color:var(--muted);font-weight:400;font-size:10px">차트점수 실증</span></div>
    ${baseLine}
    <div class="signal-bars">${rows}</div>
  </div>`;
}

// 백테스트: 동일 매수 규칙을 과거 장기(기본 5년)에 적용한 성과를 카드 안에 표시
async function runBacktest(ticker, boxId) {
  const box = document.getElementById(boxId || 'bt-' + ticker);
  if (!box) return;
  box.innerHTML = '<span style="color:var(--muted);font-size:12px">백테스트 계산 중… (수 초 소요)</span>';
  try {
    const res = await apiFetch(`${API}/backtest/${encodeURIComponent(ticker)}`);
    const json = await res.json();
    if (!json.success) throw new Error(json.error || '백테스트 실패');
    const d = json.data;
    const beat = d.strategy_return >= d.buy_hold_return;
    const relWarn = (d.reliable === false) ? ' <span style="color:var(--yellow);font-size:10px">(표본부족)</span>' : '';
    const oos = d.oos || {};
    const hasOos = oos.first != null && oos.second != null;
    const oosOk = hasOos && oos.first > 0 && oos.second > 0;   // 전·후반 둘 다 양수 = 일관성
    const oosTxt = hasOos
      ? `<span style="color:${oosOk ? 'var(--green)' : 'var(--yellow)'}">${oos.first >= 0 ? '+' : ''}${oos.first}% / ${oos.second >= 0 ? '+' : ''}${oos.second}%</span>`
      : '-';
    box.innerHTML = `
      <div style="padding:10px;background:var(--surface2);border-radius:8px;font-size:12px">
        <div style="display:grid;grid-template-columns:1fr 1fr;gap:6px 12px">
          <div>거래 횟수 <b>${d.trades}</b>${relWarn}</div>
          <div>승률 <b>${d.win_rate != null ? d.win_rate + '%' : '-'}</b></div>
          <div>1회 기대수익 <b style="color:${d.expectancy >= 0 ? 'var(--green)' : 'var(--red)'}">${d.expectancy != null ? d.expectancy + '%' : '-'}</b></div>
          <div>수익팩터 <b>${d.profit_factor != null ? d.profit_factor : '-'}</b></div>
          <div>전략 누적 <b style="color:${beat ? 'var(--green)' : 'var(--yellow)'}">${d.strategy_return}%</b></div>
          <div>단순보유 <b>${d.buy_hold_return}%</b></div>
          <div>최대낙폭 <b style="color:var(--red)">${d.max_drawdown}%</b></div>
          <div title="거래를 시간순 전·후반으로 나눈 기대수익 — 둘 다 +면 일관성 있음">전·후반 기대 ${oosTxt}</div>
          <div style="grid-column:1/3">청산 🎯${d.exits.target} 🛑${d.exits.stop} ⏰${d.exits.time}</div>
        </div>
        ${bucketHtml(d)}
        <div style="margin-top:8px;color:var(--muted);font-size:10px;line-height:1.5">${esc(d.note)}</div>
      </div>`;
  } catch (e) {
    box.innerHTML = `<span style="color:var(--red);font-size:12px">백테스트 실패: ${esc(e.message)}</span>`;
  }
}

// ---- 시장(국내장/해외장) 선택 바 ----
const MARKETS = [{ id: 'kr', label: '🇰🇷 국내장' }, { id: 'us', label: '🌎 해외장' }];
function renderMarketBar() {
  const bar = document.getElementById('market-bar');
  if (!bar) return;
  bar.innerHTML = MARKETS.map(m => {
    const n = groups.filter(g => !isSpecialGroup(g.id) && groupMarket(g) === m.id).length;
    return `<div class="market-pill ${selectedMarket === m.id ? 'active' : ''}" onclick="switchMarket('${m.id}')" title="${m.label} 그룹만 보기">
       <span>${m.label}</span><span class="group-count">${n}</span>
     </div>`;
  }).join('');
}

function switchMarket(m) {
  if ((m !== 'kr' && m !== 'us') || m === selectedMarket) return;
  selectedMarket = m;
  // 활성 그룹이 특수그룹(즐겨찾기·빠른조회)이거나 이 시장 소속이면 그대로 유지,
  // 아니면 이 시장의 첫 그룹(없으면 즐겨찾기)으로 전환한다.
  const cur = curGroup();
  if (!cur || (!isSpecialGroup(cur.id) && groupMarket(cur) !== m)) {
    const first = groups.find(g => !isSpecialGroup(g.id) && groupMarket(g) === m);
    activeId = first ? first.id : (favGroup() ? FAV_ID : (groups[0] && groups[0].id) || null);
  }
  saveState();
  renderGroupBar();
  loadActiveGroup();
}

// ---- 그룹 관리 ----
function renderGroupBar() {
  renderMarketBar();  // 시장 바(그룹 개수 배지)도 함께 갱신
  const bar = document.getElementById('group-bar');
  if (!bar) return;
  // 특수 그룹(즐겨찾기·빠른조회)은 두 시장 공통으로 항상 노출, 실제 그룹은 선택 시장만.
  const visible = groups.filter(g => isSpecialGroup(g.id) || groupMarket(g) === selectedMarket);
  bar.innerHTML = visible.map(g => {
    const fav = g.id === FAV_ID;
    const special = isSpecialGroup(g.id);  // 즐겨찾기·빠른조회는 이름변경/삭제 불가
    const tip = fav ? '즐겨찾기 모음' : (g.id === QUICK_ID ? '검색해서 잠깐 보기 (저장 안 됨)' : '더블클릭하면 이름 변경');
    return `<div class="group-pill ${g.id === activeId ? 'active' : ''} ${fav ? 'fav-pill' : ''}" onclick="switchGroup('${g.id}')" ${special ? '' : `ondblclick="renameGroup('${g.id}')"`} title="${tip}">
       <span>${esc(g.name)}</span>
       <span class="group-count">${viewTickers(g).length}</span>
       ${special ? '' : `<button class="group-edit" onclick="event.stopPropagation();renameGroup('${g.id}')" title="이름 변경">✎</button>`}
       ${!special ? `<button class="group-del" onclick="event.stopPropagation();deleteGroup('${g.id}')" title="그룹 삭제">✕</button>` : ''}
     </div>`;
  }).join('') + `<button class="group-add" onclick="newGroup()">+ 새 그룹</button>`;
}

function switchGroup(id) {
  if (id === activeId) return;
  activeId = id;
  saveState();
  renderGroupBar();
  loadActiveGroup();
}

function newGroup() {
  const label = selectedMarket === 'kr' ? '국내장' : '해외장';
  const name = prompt(`새 그룹 이름 (${label}):`, '새 그룹');
  if (name === null) return;
  // 새 그룹은 현재 선택된 시장에 소속된다.
  const g = { id: genId(), name: name.trim() || '새 그룹', tickers: [], market: selectedMarket };
  groups.push(g);
  activeId = g.id;
  saveState();
  renderGroupBar();
  loadActiveGroup();
}

function renameGroup(id) {
  if (id === FAV_ID || id === QUICK_ID) return;  // 즐겨찾기·빠른조회는 이름 변경 불가
  const g = groups.find(x => x.id === id);
  if (!g) return;
  const name = prompt('그룹 이름 변경:', g.name);
  if (name === null) return;
  g.name = name.trim() || g.name;
  saveState();
  renderGroupBar();
}

function deleteGroup(id) {
  if (id === FAV_ID || id === QUICK_ID) { showError('이 그룹은 삭제할 수 없습니다'); return; }
  const g = groups.find(x => x.id === id);
  if (!g) return;
  if (!confirm(`'${g.name}' 그룹을 삭제할까요?`)) return;
  groups = groups.filter(x => x.id !== id);
  if (activeId === id) {
    // 같은 시장의 다른 그룹을 우선 선택, 없으면 즐겨찾기(시장은 그대로 유지).
    const next = groups.find(x => !isSpecialGroup(x.id) && groupMarket(x) === selectedMarket)
              || favGroup() || groups[0];
    activeId = next ? next.id : null;
  }
  saveState();
  renderGroupBar();
  loadActiveGroup();
}

// ---- 렌더 ----
function renderAll() {
  if (activeTab === 'overview') renderCards();
  else if (activeTab === 'compare') renderCompareTable();
  else if (activeTab === 'charts') renderCharts();
  else if (activeTab === 'signal') renderSignalTab();
  else if (activeTab === 'ranking') renderRanking();
  else if (activeTab === 'paper') renderPaper();
}

function renderLoadingCard(ticker) {
  const c = document.getElementById('cards-container');
  let el = document.getElementById(`card-${ticker}`);
  if (!el) {
    el = document.createElement('div');
    el.id = `card-${ticker}`;
    el.className = 'loading-card';
    c.appendChild(el);
  }
  // 재시도 예산(4회)을 다 쓰고도 데이터가 없으면 무한 스피너 대신 '다시 시도' 카드.
  // (직전 값이 로컬 캐시에 있으면 애초에 이 카드가 아니라 데이터 카드가 그려진다)
  const exhausted = (_retryCount[ticker] || 0) > 4;
  el.innerHTML = exhausted
    ? `<div style="text-align:center;color:var(--muted);font-size:13px;padding:8px">
         <div style="font-weight:600;color:var(--text)">${esc(ticker)}</div>
         <div style="margin:8px 0">⚠ 지금 불러올 수 없어요<br><span style="font-size:11px">(서버·시세 지연)</span></div>
         <button class="secondary" style="font-size:12px;padding:5px 14px" onclick="retryTicker('${esc(ticker)}')">다시 시도</button>
       </div>`
    : `<div class="spinner"></div><span>${esc(ticker)} 로딩 중...</span>`;
}

function renderCards() {
  const c = document.getElementById('cards-container');
  c.innerHTML = '';
  const g = curGroup();
  viewTickers(g).forEach(ticker => {
    const d = stocks[ticker];
    if (!d) { renderLoadingCard(ticker); return; }
    const card = document.createElement('div');
    card.className = 'stock-card';
    card.id = `card-${ticker}`;
    card.draggable = true;
    card.dataset.ticker = ticker;
    const chg = d.changePercent;
    // 주의: JS에서 null >= 0 은 true 라서, 등락률이 아직 안 들어온(null) 종목을
    // 무조건 'up'(초록)으로 칠하던 버그가 있었다. 숫자일 때만 상승/하락을 판정한다.
    const hasChg = typeof chg === 'number' && !isNaN(chg);
    const chgCls = !hasChg ? 'neutral' : (chg >= 0 ? 'up' : 'down');
    const chgSign = hasChg && chg > 0 ? '+' : '';
    card.innerHTML = `
      <button class="card-remove" onclick="removeTicker('${ticker}')" title="현재 그룹에서 제거">✕</button>
      <div class="card-header">
        <div style="min-width:0">
          <div style="display:flex;align-items:center;gap:6px">
            <button id="fav-${ticker}" class="card-fav ${isFav(ticker) ? 'on' : ''}" onclick="toggleFav('${ticker}')" title="${isFav(ticker) ? '즐겨찾기 해제' : '즐겨찾기 추가'}">${isFav(ticker) ? '★' : '☆'}</button>
            <div class="card-ticker">${esc(d.name)}</div>
          </div>
          <div class="card-name">${esc(ticker)}</div>
          <div style="font-size:10px;color:var(--muted);margin-top:2px">${esc(d.sector)}</div>
        </div>
        <div class="card-price">
          <div class="card-price-val ${chgCls}">${fmt(d.price, d.currency)}</div>
          <div class="card-change ${chgCls}">${chgSign}${pct(chg)}</div>
        </div>
      </div>
      <div class="mini-chart"><canvas id="mini-${ticker}"></canvas></div>
      <div class="card-metrics">
        ${metricBlock('PER (TTM)', d.per, 'x')}
        ${metricBlock('PBR', d.pbr, 'x')}
        ${metricBlock('ROE', d.roe, '%', 100)}
        ${metricBlock('ROA', d.roa, '%', 100)}
        ${metricBlock('순이익률', d.netMargin, '%', 100)}
        ${metricBlock('영업이익률', d.operatingMargin, '%', 100)}
        ${metricBlock('부채비율', d.debtToEquity)}
        ${metricBlock('배당수익률', d.dividendYield, '%', 100)}
      </div>
      <div style="margin-top:12px;display:grid;grid-template-columns:1fr 1fr;gap:4px;font-size:11px;color:var(--muted)">
        <span>시총 ${bigNum(d.marketCap)}</span>
        <span>매출 ${bigNum(d.revenue)}</span>
        <span>EPS ${d.eps != null ? d.eps.toFixed(2) : '-'}</span>
        <span>Beta ${d.beta != null ? d.beta.toFixed(2) : '-'}</span>
      </div>
      ${d.targetPrice ? `<div style="margin-top:10px;font-size:11px;color:var(--muted)">목표주가 <span style="color:var(--yellow)">${fmt(d.targetPrice, d.currency)}</span> | 의견 <span style="color:var(--yellow)">${esc(d.recommendation)}</span></div>` : ''}
      ${signalBadgeHtml(ticker)}
    `;
    attachDragHandlers(card, ticker);
    c.appendChild(card);
    drawMiniChart(ticker, d.history);
  });
}

// ---- 카드 드래그앤드롭 정렬 ----
let dragTicker = null;
function attachDragHandlers(card, ticker) {
  card.addEventListener('dragstart', e => {
    dragTicker = ticker;
    e.dataTransfer.effectAllowed = 'move';
    card.classList.add('dragging');
  });
  card.addEventListener('dragend', () => {
    dragTicker = null;
    document.querySelectorAll('.stock-card.dragging, .stock-card.drag-over')
      .forEach(el => el.classList.remove('dragging', 'drag-over'));
  });
  card.addEventListener('dragover', e => {
    e.preventDefault();
    e.dataTransfer.dropEffect = 'move';
    if (dragTicker && dragTicker !== ticker) card.classList.add('drag-over');
  });
  card.addEventListener('dragleave', () => card.classList.remove('drag-over'));
  card.addEventListener('drop', e => {
    e.preventDefault();
    card.classList.remove('drag-over');
    if (!dragTicker || dragTicker === ticker) return;
    const arr = curGroup().tickers;
    const from = arr.indexOf(dragTicker), to = arr.indexOf(ticker);
    if (from < 0 || to < 0) return;
    arr.splice(from, 1);
    arr.splice(to, 0, dragTicker);
    saveState();
    renderCards();
  });
}

function metricBlock(label, val, unit='', mult=1) {
  const display = val != null ? `${(val*mult).toFixed(unit==='%'?1:2)}${unit}` : '-';
  return `<div class="metric"><div class="metric-label">${label}</div><div class="metric-val">${display}</div></div>`;
}

function drawMiniChart(ticker, history) {
  if (!history || !history.length) return;
  setTimeout(() => {
    const canvas = document.getElementById(`mini-${ticker}`);
    if (!canvas) return;
    const existing = Chart.getChart(canvas);
    if (existing) existing.destroy();
    const ctx = canvas.getContext('2d');
    const prices = history.map(h => h.close);
    const labels = history.map(h => h.date);
    const startPrice = prices[0];
    const endPrice = prices[prices.length-1];
    const color = endPrice >= startPrice ? '#3fb950' : '#f85149';
    new Chart(ctx, {
      type: 'line',
      data: {
        labels,
        datasets: [{ data: prices, borderColor: color, borderWidth: 1.5, pointRadius: 0, fill: true,
          backgroundColor: ctx => {
            const g = ctx.chart.ctx.createLinearGradient(0,0,0,50);
            g.addColorStop(0, color+'44'); g.addColorStop(1, color+'00'); return g;
          }
        }]
      },
      options: { responsive:true, maintainAspectRatio:false, plugins:{legend:{display:false},tooltip:{enabled:false}}, scales:{x:{display:false},y:{display:false}}, animation:{duration:400} }
    });
  }, 50);
}

function renderCompareTable() {
  const tickers = orderedTickers();
  const section = document.getElementById('compare-section');
  if (tickers.length < 1) { section.innerHTML = '<p style="color:var(--muted);padding:20px">기업을 1개 이상 추가하면 비교 테이블이 표시됩니다.</p>'; return; }

  // 통화가 섞여 있으면 금액성 지표는 단순 비교가 무의미 → 하이라이트 생략
  const currencies = tickers.map(t => stocks[t].currency || 'USD');
  const mixedCurrency = new Set(currencies).size > 1;

  let html = `<table class="compare-table"><thead><tr><th>지표</th>`;
  tickers.forEach(t => html += `<th class="ticker-head">${esc(stocks[t].name || t)}<div style="font-size:10px;color:var(--muted);font-weight:400">${esc(t)}</div></th>`);
  html += `</tr></thead><tbody>`;

  METRIC_GROUPS.forEach(group => {
    html += `<tr><td class="section-header" colspan="${tickers.length+1}">${group.label}</td></tr>`;
    group.rows.forEach(row => {
      const vals = tickers.map(t => stocks[t][row.key]);
      const numVals = vals.map(v => typeof v === 'number' ? v : null);
      const defined = numVals.filter(v => v !== null);
      let bestIdx = -1, worstIdx = -1;
      if (row.higherBetter !== null && defined.length > 1 && !(row.money && mixedCurrency)) {
        const best = row.higherBetter ? Math.max(...defined) : Math.min(...defined);
        const worst = row.higherBetter ? Math.min(...defined) : Math.max(...defined);
        bestIdx = numVals.indexOf(best);
        worstIdx = numVals.indexOf(worst);
      }
      html += `<tr><td>${row.label}</td>`;
      tickers.forEach((t, i) => {
        const d = stocks[t];
        const display = row.fmt(d[row.key], d);
        const cls = i === bestIdx ? 'best' : (i === worstIdx ? 'worst' : '');
        html += `<td class="${cls}">${display}</td>`;
      });
      html += `</tr>`;
    });
  });

  html += `</tbody></table>`;
  section.innerHTML = html;
}

// ---- 실시간 랭킹 (네이버 목록 기반, 서버 30초 캐시) ----
// 국내/미국은 상단 시장 바(selectedMarket)를 따른다. 행을 누르면 빠른 조회로 열고,
// ☆는 즐겨찾기 토글. 실패해도 직전 목록을 유지하고, 처음부터 실패면 '다시 시도' 카드.
const RANK_SORTS = [
  { id: 'value', label: '거래대금' }, { id: 'volume', label: '거래량' },
  { id: 'up', label: '상승' }, { id: 'down', label: '하락' }, { id: 'cap', label: '시가총액' },
];
let rankSort = 'value';
// ETF 제외 여부는 이 기기에 기억한다(랭킹 보는 습관이라 동기화까지는 불필요).
let rankNoEtf = (() => { try { return localStorage.getItem('marketeye_rank_noetf') === '1'; } catch (e) { return false; } })();
const rankData = {};      // 'kr:value:all' → { rows, approx, stale, at, error }
let rankLoading = null;
function rankKey() { return `${selectedMarket}:${rankSort}:${rankNoEtf ? 'noetf' : 'all'}`; }
function setRankSort(id) { if (id !== rankSort) { rankSort = id; renderRanking(); } }
function toggleRankEtf() {
  rankNoEtf = !rankNoEtf;
  try { localStorage.setItem('marketeye_rank_noetf', rankNoEtf ? '1' : '0'); } catch (e) {}
  renderRanking();
}

async function fetchRanking(force) {
  const key = rankKey();
  const cur = rankData[key];
  if (rankLoading === key || (!force && cur && !cur.error && Date.now() - cur.at < 25000)) return;
  rankLoading = key;
  try {
    const [market, sort, etf] = key.split(':');
    const res = await apiFetch(`${API}/ranking?market=${market}&sort=${sort}${etf === 'noetf' ? '&etf=exclude' : ''}`, {}, 20000);
    const json = await res.json();
    if (!json.success) throw new Error(json.error || '랭킹을 불러오지 못했어요');
    rankData[key] = { ...json.data, stale: !!json.stale, at: Date.now() };
  } catch (e) {
    rankData[key] = { ...(rankData[key] || { rows: [], at: 0 }), error: e.message };
  } finally {
    if (rankLoading === key) rankLoading = null;
  }
  if (activeTab === 'ranking' && rankKey() === key) { drawRanking(); drawRankPanelHead(); }
}

function renderRanking() { drawRanking(); fetchRanking(false); }

function _rankNum(v, cur) {
  if (v == null) return '-';
  return cur === 'KRW' ? Math.round(v).toLocaleString() : v.toLocaleString(undefined, { minimumFractionDigits: 2, maximumFractionDigits: 2 });
}
function _rankCount(n) {   // 거래량(주) → '66.5억주' / '1,032만주'
  if (n == null) return '-';
  if (n >= 1e8) return (n / 1e8).toFixed(1) + '억주';
  if (n >= 1e4) return Math.round(n / 1e4).toLocaleString() + '만주';
  return Math.round(n).toLocaleString() + '주';
}
function _rankSub(r) {
  if (rankSort === 'volume') return `거래량 ${_rankCount(r.volume)}`;
  if (rankSort === 'cap') return `시가총액 ${r.marketCapText || '-'}`;
  return `거래대금 ${r.tradingValueText || '-'}`;
}

function drawRanking() {
  const box = document.getElementById('ranking-section');
  if (!box) return;
  const d = rankData[rankKey()];
  const mLabel = selectedMarket === 'kr' ? '국내' : '미국';
  const chips = RANK_SORTS.map(o =>
    `<button class="rank-chip ${o.id === rankSort ? 'active' : ''}" onclick="setRankSort('${o.id}')">${o.label}</button>`).join('')
    + `<label class="rank-toggle" title="ETF·ETN을 빼고 개별 종목만 순위 매기기"><input type="checkbox" ${rankNoEtf ? 'checked' : ''} onchange="toggleRankEtf()"> ETF 제외</label>`;
  let meta = '';
  if (d && d.at) {
    const t = new Date(d.at);
    meta = `${mLabel} · ${String(t.getHours()).padStart(2, '0')}:${String(t.getMinutes()).padStart(2, '0')} 기준`
      + (rankNoEtf ? ' · ETF 제외' : '') + (d.stale ? ' · 직전 데이터' : '') + (d.approx ? ' · 시가총액 상위 기준 근사' : '');
  } else meta = mLabel;
  let body;
  if (d && d.rows && d.rows.length) {
    body = '<div class="rank-list">' + d.rows.map((r, i) => {
      const cls = r.changePct > 0 ? 'up' : r.changePct < 0 ? 'down' : 'neutral';
      const cur = r.currency === 'KRW' ? '' : '$';
      // 부호는 통화기호 앞에: +$2.20 / -$2.40 / -6,000
      const sgn = v => v > 0 ? '+' : v < 0 ? '-' : '';
      const chg = r.change == null ? '-' : `${sgn(r.change)}${cur}${_rankNum(Math.abs(r.change), r.currency)}`;
      const pct = r.changePct == null ? '-' : `${sgn(r.changePct)}${Math.abs(r.changePct).toFixed(2)}%`;
      const fav = isFav(r.ticker);
      const t = esc(r.ticker);
      return `<div class="rank-row ${rankPanel && rankPanel.ticker === r.ticker ? 'sel' : ''}" onclick="openRankPanel('${t}')" title="${t} — 눌러서 옆에서 진입 신호 보기">
        <div class="rank-no">${i + 1}</div>
        ${r.logo ? `<img class="rank-logo" src="${esc(r.logo)}" alt="" loading="lazy" referrerpolicy="no-referrer" onerror="this.style.visibility='hidden'">` : '<div class="rank-logo"></div>'}
        <div style="min-width:0">
          <div class="rank-name">${esc(r.name)}${r.etf ? '<span class="rank-etf">ETF</span>' : ''}</div>
          <div class="rank-sub">${esc(_rankSub(r))}</div>
        </div>
        ${r.chart ? `<img class="rank-spark" src="${esc(r.chart)}" alt="" loading="lazy" referrerpolicy="no-referrer" onerror="this.style.visibility='hidden'">` : '<div class="rank-spark"></div>'}
        <div class="rank-price">
          <b>${cur}${_rankNum(r.price, r.currency)}</b>
          <div class="${cls}">${chg} (${pct})</div>
        </div>
        <button class="rank-fav ${fav ? 'on' : ''}" onclick="event.stopPropagation();toggleRankFav('${t}')" title="${fav ? '즐겨찾기 해제' : '즐겨찾기 추가'}">${fav ? '★' : '☆'}</button>
      </div>`;
    }).join('') + '</div>';
  } else if (d && d.error) {
    body = `<div class="rank-list rank-empty">랭킹을 불러오지 못했어요<br><span style="font-size:12px">${esc(d.error)}</span><br>
      <button class="secondary" onclick="fetchRanking(true)">다시 시도</button></div>`;
  } else {
    body = '<div class="rank-list rank-empty">불러오는 중...</div>';

let rankPanel = null;                 // { ticker }

function rankPanelRows() { const d = rankData[rankKey()]; return (d && d.rows) || []; }

function stepRankPanel(dir) {

async function loadPanelSignal(t, force) {
  const c = panelSig[t];

  if (!force && !c && signals[t]) { panelSig[t] = { data: signals[t], at: Date.now() }; drawRankPanelBody(); return; }
  panelSig[t] = { ...(c || {}), loading: true, error: '' };

    panelSig[t] = { data: json.data, at: Date.now() };
  } catch (e) {
    panelSig[t] = { ...(panelSig[t] || {}), loading: false, error: e.message };

  if (rankPanel && rankPanel.ticker === t) drawRankPanelBody();
}
function rankPanelRow() {   // 정렬·시장을 바꿔 목록에서 빠져도 열 때의 행 정보로 머리말 유지

// 패널 뼈대(처음 열 때만) → 머리말(시세·순위, 랭킹 갱신 때마다) / 본문(신호, 받아올 때만)을 따로 그린다.
// 본문을 매번 다시 그리면 펼쳐 둔 백테스트 결과·스크롤 위치가 30초마다 날아간다.

// 랭킹 종목을 빠른 조회(저장 안 되는 임시 그룹)로 열어 카드·신호를 본다.

// ---- 모의투자 ----
// 계좌는 시장별(국내=원화, 해외=달러)로 따로 굴린다. 주문은 '진짜 주식처럼' 서버가 체결가를
// 정한다(/api/paper/quote: 장중=그 시각 가격, 장전=당일 시가, 장후·휴장=다음 거래일 시가,
// 미래=예약). 신호 정확도 점검이 목적이라 매수 금액 제한(현금 잔고)은 없다 — 수익률은 누적
// 매수금액 대비로 본다. 보유는 체결된 주문을 시간순으로 다시 계산(replay)해 구하므로 과거 날짜
// 주문을 끼워 넣어도 일관된다(보유보다 많이 파는 것만 막음). 매수마다 '그 시점 점수'를 남긴다.
// 저장: 로그인 코드별 서버 행('<코드>::paper') + 이 기기 사본(서버 실패 시에도 유지).
const PAPER_KEY = 'marketeye_paper_v1';
// 수수료·세금 가정(비율): 국내 매도는 증권거래세 포함, 해외는 국내 증권사 일반 수수료 수준.
const PAPER_FEES = { kr: { buy: 0.00015, sell: 0.00015 + 0.0018 }, us: { buy: 0.0025, sell: 0.0025 } };
const PAPER_TZ = { kr: 'Asia/Seoul', us: 'America/New_York' };
let paper = null;                 // { v, orders: [...] } (구버전의 capital 필드는 무시)
let paperLoaded = false;          // 서버 상태를 한 번이라도 받았는가(받기 전엔 서버에 덮어쓰지 않음)
let paperLoading = null;          // 진행 중 Promise
let paperNote = '';
let paperEval = { key: '', at: 0, data: {}, error: '', loading: false };
let paperPendingAt = 0, paperResolving = false;
let paperAccFilter = 'all';       // 'all' | 'live' (과거 날짜 지정 주문 제외)
let paperForm = { ticker: '', name: '', side: 'buy', qty: '', amount: '', when: 'now', at: '', preview: null, busy: false };

function paperEmpty() { return { v: 1, orders: [] }; }
function paperReset() {
  paper = null; paperLoaded = false; paperNote = '';
  paperEval = { key: '', at: 0, data: {}, error: '', loading: false };
}
function paperLocal() {
  try {
    const c = JSON.parse(localStorage.getItem(PAPER_KEY) || 'null');
    if (c && c.code === syncCode && c.data && Array.isArray(c.data.orders)) return c;
  } catch (e) {}
  return null;
}
function paperLocalSave(dirty) {
  try { localStorage.setItem(PAPER_KEY, JSON.stringify({ code: syncCode, data: paper, dirty })); } catch (e) {}
}

let paperSyncTimer = null;
function paperSave() {
  paperLocalSave(true);
  if (!syncCode || !paperLoaded) return;   // 서버 상태를 모르면 이 기기에만 보관(다음 로드 때 합침)
  clearTimeout(paperSyncTimer);
  paperSyncTimer = setTimeout(async () => {
    try {
      const res = await apiFetch(`${API}/paper/account/${encodeURIComponent(syncCode)}`, {
        method: 'PUT', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ data: paper }),
      });
      const json = await res.json();
      if (!json.success) throw new Error(json.error || '저장 실패');
      paperLocalSave(false);
      if (paperNote) { paperNote = ''; drawPaperData(); }
    } catch (e) {
      paperNote = '서버 저장 실패 — 이 기기에는 저장됨';
      drawPaperData();
    }
  }, 800);
}

function paperLoad() {
  if (paperLoading) return paperLoading;
  const local = paperLocal();
  if (!paper) paper = local ? local.data : paperEmpty();
  if (!syncCode) { paperLoaded = false; return Promise.resolve(); }
  paperLoading = (async () => {
    try {
      const res = await apiFetch(`${API}/paper/account/${encodeURIComponent(syncCode)}`, {}, 75000);
      const json = await res.json();
      if (!json.success) throw new Error(json.error || '불러오기 실패');
      const srv = json.data && Array.isArray(json.data.orders) ? json.data : null;
      const cur = paperLocal();
      if (srv) {
        // 서버 저장 전에 이 기기에서만 낸 주문이 있으면 합친다(서버가 기준).
        const ids = new Set(srv.orders.map(o => o.id));
        const extra = cur && cur.dirty ? cur.data.orders.filter(o => !ids.has(o.id)) : [];
        paper = { ...srv, orders: srv.orders.concat(extra) };
        paperLoaded = true;
        if (extra.length) paperSave(); else paperLocalSave(false);
      } else {
        paperLoaded = true;
        if (paper.orders.length) paperSave();   // 서버가 비었으면 이 기기 계좌를 올린다
      }
      paperNote = '';
    } catch (e) {
      paperNote = `계좌 서버 불러오기 실패 — 이 기기 저장본 표시 중 (${e.message})`;
    } finally {
      paperLoading = null;
    }
    if (activeTab === 'paper') { drawPaperData(); paperTick(true); }
  })();
  return paperLoading;
}

// 체결된 주문을 시간순으로 재생해 보유·누적 매수금액·실현손익을 구한다. 그 시점 보유보다
// 많이 팔면 bad(그 주문)로 표시 — 새 주문·삭제의 유효성 검사에 쓴다. 매수는 금액 제한 없음.
function paperBook(m, orders) {
  orders = orders || paper.orders;
  const fee = PAPER_FEES[m];
  let invested = 0, realized = 0, fees = 0, bad = null;
  const pos = {};
  const filled = orders.filter(o => o.market === m && o.status === 'filled')
    .sort((a, b) => (new Date(a.fill_at) - new Date(b.fill_at)) || (a.placed < b.placed ? -1 : 1));
  for (const o of filled) {
    const p = pos[o.ticker] || (pos[o.ticker] = { ticker: o.ticker, name: o.name, qty: 0, cost: 0 });
    const gross = o.qty * o.price;
    if (o.side === 'buy') {
      const f = gross * fee.buy;
      invested += gross + f; fees += f; p.qty += o.qty; p.cost += gross + f;
    } else {
      if (o.qty > p.qty + 1e-9) { bad = bad || o; continue; }
      const f = gross * fee.sell, basis = p.cost / p.qty * o.qty;
      realized += gross - f - basis; fees += f;
      p.cost -= basis; p.qty -= o.qty;
    }
  }
  Object.keys(pos).forEach(t => { if (pos[t].qty <= 1e-9) delete pos[t]; });
  return { invested, pos, realized, fees, bad };
}
function paperBadMsg() { return '그 시점 보유 수량보다 많이 팔 수 없어요'; }

// ── 형식 ──
function ppMoney(v, m, signed) {
  if (v == null || !isFinite(v)) return '-';
  const s = v > 0 ? (signed ? '+' : '') : v < 0 ? '-' : '';
  const a = Math.abs(v);
  return m === 'kr' ? `${s}${Math.round(a).toLocaleString()}원`
    : `${s}$${a.toLocaleString(undefined, { minimumFractionDigits: 2, maximumFractionDigits: 2 })}`;
}
function ppPct(v) { return v == null || !isFinite(v) ? '-' : `${v > 0 ? '+' : ''}${v.toFixed(2)}%`; }
function ppCls(v) { return v > 0 ? 'up' : v < 0 ? 'down' : 'neutral'; }
function ppTime(iso, m) {
  if (!iso) return '-';
  const s = new Date(iso).toLocaleString('ko-KR', { timeZone: PAPER_TZ[m], year: '2-digit', month: 'numeric', day: 'numeric', hour: '2-digit', minute: '2-digit', hour12: false });
  return m === 'us' ? `${s} (뉴욕)` : s;
}
function kstNowLocal() {   // datetime-local 기본값: 한국시간 'YYYY-MM-DDTHH:MM'
  return new Intl.DateTimeFormat('sv-SE', { timeZone: 'Asia/Seoul', year: 'numeric', month: '2-digit', day: '2-digit', hour: '2-digit', minute: '2-digit', hour12: false })
    .format(new Date()).replace(' ', 'T');
}
function ppScore(o) {   // 정확도 점검에 쓰는 진입 점수: 실시간 종합 점수 우선, 없으면 그 시점 차트 점수
  if (o.live && o.live.combined != null) return { v: o.live.combined, basis: '종합' };
  if (o.sig && o.sig.tech != null) return { v: o.sig.tech, basis: '차트' };
  return null;
}
function ppPlan(o) {
  const src = (o.live && (o.live.stop != null || o.live.target != null)) ? o.live : (o.sig || {});
  return { stop: src.stop != null ? src.stop : null, target: src.target != null ? src.target : null };
}
function ppLast(t) {   // 평가 응답의 현재가(같은 종목 아무 매수건) → 없으면 카드 시세
  for (const o of paper.orders) {
    const ev = o.ticker === t && paperEval.data[o.id];
    if (ev && ev.last != null) return ev.last;
  }
  return stocks[t] && stocks[t].price != null ? stocks[t].price : null;
}

// ── 렌더 ──
function renderPaper() {
  const box = document.getElementById('paper-section');

    }

      <div class="pp-summary" id="pp-summary"></div>
      <div class="pp-grid">
        <div class="pp-card" id="pp-form"></div>
        <div class="pp-card" id="pp-hold"></div>
      </div>
      <div class="pp-card" id="pp-acc"></div>

function paperTick(force) {
  if (!paper) return;
  resolvePending(force);
  refreshPaperEval(force);
}

function drawPaperData() {
  if (activeTab !== 'paper' || !paper || !document.getElementById('pp-summary')) return;
  const m = selectedMarket;
  const book = paperBook(m);
  let evalAmt = 0, costAmt = 0, unknown = 0;
  const holds = Object.values(book.pos).map(p => {
    const last = ppLast(p.ticker);
    if (last == null) unknown++;
    const value = p.qty * (last != null ? last : p.cost / p.qty);
    evalAmt += value; costAmt += p.cost;
    return { ...p, last, value, pnl: last != null ? value - p.cost : null };
  });
  const unreal = evalAmt - costAmt, pnl = book.realized + unreal;
  const pnlPct = book.invested > 0 ? pnl / book.invested * 100 : null;
  document.getElementById('pp-meta').textContent = `${m === 'kr' ? '국내 계좌 · 원화' : '해외 계좌 · 달러'} · 매수 금액 제한 없음`;
  document.getElementById('pp-note').textContent = paperNote || (paperEval.error ? `시세 평가 실패: ${paperEval.error}` : '');
  document.getElementById('pp-summary').innerHTML = `
    <div class="pp-stat"><div class="pp-k">총 손익</div><div class="pp-v ${ppCls(pnl)}">${ppMoney(pnl, m, true)}</div>
      <div class="pp-s ${ppCls(pnl)}">누적 매수금액 대비 ${ppPct(pnlPct)}</div></div>
    <div class="pp-stat"><div class="pp-k">누적 매수금액</div><div class="pp-v">${ppMoney(book.invested, m)}</div>
      <div class="pp-s neutral">수수료·세금 누적 ${ppMoney(book.fees, m)}</div></div>
    <div class="pp-stat"><div class="pp-k">평가금액</div><div class="pp-v">${ppMoney(evalAmt, m)}</div>
      <div class="pp-s ${ppCls(unreal)}">${holds.length}종목 · 평가손익 ${ppMoney(unreal, m, true)}${unknown ? ` · 시세 대기 ${unknown}` : ''}</div></div>
    <div class="pp-stat"><div class="pp-k">실현 손익</div><div class="pp-v ${ppCls(book.realized)}">${ppMoney(book.realized, m, true)}</div>
      <div class="pp-s neutral">매도 확정분</div></div>`;

  document.getElementById('pp-hold').innerHTML = `<div class="pp-title">보유 종목 ${paperEval.loading ? '<span class="rank-meta">시세 갱신 중...</span>' : ''}</div>` + (holds.length ? `
    <div class="pp-scroll"><table class="pp-table">
      <tr><th>종목</th><th>수량</th><th>평단</th><th>현재가</th><th>평가손익</th><th></th></tr>
      ${holds.map(h => `<tr>
        <td><div class="pp-name">${esc(h.name || h.ticker)}</div><div class="pp-tk">${esc(h.ticker)}</div></td>
        <td>${h.qty.toLocaleString()}</td>
        <td>${ppMoney(h.cost / h.qty, m)}</td>
        <td>${h.last != null ? ppMoney(h.last, m) : '-'}</td>
        <td class="${ppCls(h.pnl)}">${h.pnl != null ? `${ppMoney(h.pnl, m, true)}<br>${ppPct(h.pnl / h.cost * 100)}` : '-'}</td>
        <td><button class="pp-mini" onclick="paperSellPrefill('${esc(h.ticker)}')">매도</button></td>
      </tr>`).join('')}
    </table></div>` : '<div class="pp-empty">보유 종목이 없어요. 왼쪽에서 첫 주문을 넣어 보세요.</div>');

  drawPaperAccuracy(m);
  drawPaperOrders(m);
  document.getElementById('pp-foot').innerHTML = `
    <span>수수료·세금 가정: ${m === 'kr' ? '매수 0.015% · 매도 0.015%+거래세 0.18%' : '매수·매도 각 0.25%'} · 배당 미반영 · 평단은 매수 수수료 포함</span>
    <button class="pp-mini" onclick="paperResetMarket()">이 계좌 초기화</button>`;
}

function drawPaperOrders(m) {
  const box = document.getElementById('pp-orders');
  const list = paper.orders.filter(o => o.market === m).slice().sort((a, b) => (b.placed > a.placed ? 1 : -1));
  const SIDE = { buy: '<span style="color:var(--red)">매수</span>', sell: '<span style="color:var(--blue)">매도</span>' };
  const ST = { filled: '체결', pending: '대기', failed: '실패', canceled: '취소' };
  box.innerHTML = `<div class="pp-title">주문 내역 <span class="rank-meta">${list.length}건</span></div>` + (list.length ? list.map(o => {
    const sc = ppScore(o), ev = paperEval.data[o.id];
    const ret = o.side === 'buy' && ev && ev.ret != null ? ` · 지금까지 <span class="${ppCls(ev.ret)}">${ppPct(ev.ret)}</span>` : '';
    const when = o.status === 'filled' ? `${ppTime(o.fill_at, m)} 체결 · ${esc(o.note || '')}`
      : o.status === 'pending' ? `${ppTime(o.at, m)} 주문 · ${esc(o.note || '체결 대기')}`
      : `${ppTime(o.at, m)} 주문 · ${esc(o.error || o.note || '')}`;
    const act = o.status === 'pending'
      ? `<button class="pp-mini" onclick="paperCancel('${o.id}')">취소</button>`
      : `<button class="pp-mini" onclick="paperDelete('${o.id}')" title="기록에서 지우기">삭제</button>`;
    return `<div class="pp-order">
      <span class="pp-chip ${o.status}">${ST[o.status] || o.status}</span>
      <div class="pp-main">
        <div>${SIDE[o.side]} <b>${esc(o.name || o.ticker)}</b> ${o.qty.toLocaleString()}주${o.status === 'filled' ? ` @ ${ppMoney(o.price, m)}` : ''}${ret}</div>
        <div class="pp-sub">${when}${sc ? ` · 진입 점수 ${sc.v}(${sc.basis})` : ''}${o.backdated ? ' · 과거 지정' : ''}</div>
      </div>${act}</div>`;
  }).join('') : '<div class="pp-empty">주문 내역이 없어요.</div>');
}

// ── 신호 정확도 점검 ──
// 체결된 매수 1건 = 예측 1건. 진입 점수가 높을수록(매수 고려) 이후 지수보다 잘 올라야 하고,
// 낮을수록(주의) 지수보다 못해야 신호가 맞는 것. 관망은 적중률 계산에서 뺀다.
const PP_BUCKETS = [
  { id: 'buy', label: '매수 고려 (68+)', test: s => s >= 68 },
  { id: 'hold', label: '관망 (48~67)', test: s => s >= 48 && s < 68 },
  { id: 'avoid', label: '주의 (~47)', test: s => s < 48 },
];
function ppAvg(xs) { return xs.length ? xs.reduce((a, b) => a + b, 0) / xs.length : null; }
function drawPaperAccuracy(m) {
  const box = document.getElementById('pp-acc');
  const all = paper.orders.filter(o => o.market === m && o.side === 'buy' && o.status === 'filled');
  const nBack = all.filter(o => o.backdated).length;
  const rows = all.filter(o => paperAccFilter === 'all' || !o.backdated).map(o => {
    const ev = paperEval.data[o.id] || {};
    const sc = ppScore(o);
    const ex = ev.ret != null && ev.bench_ret != null ? ev.ret - ev.bench_ret : null;
    const ex20 = ev.fwd != null && ev.bench_fwd != null ? ev.fwd - ev.bench_fwd : null;
    return { o, ev, sc, ex, ex20 };
  });
  const stats = PP_BUCKETS.map(b => {
    const r = rows.filter(x => x.sc && b.test(x.sc.v));
    const exs = r.map(x => x.ex).filter(v => v != null);
    return {
      ...b, n: r.length,
      ret: ppAvg(r.map(x => x.ev.ret).filter(v => v != null)),
      ex: ppAvg(exs),
      beat: exs.length ? exs.filter(v => v > 0).length / exs.length * 100 : null,
      n20: r.filter(x => x.ev.fwd != null).length,
      ex20: ppAvg(r.map(x => x.ex20).filter(v => v != null)),
      target: r.filter(x => x.ev.plan === 'target').length,
      stop: r.filter(x => x.ev.plan === 'stop').length,
      _r: r,
    };
  });
  const S = Object.fromEntries(stats.map(s => [s.id, s]));
  const hitN = S.buy._r.filter(x => x.ex != null).length + S.avoid._r.filter(x => x.ex != null).length;
  const hit = S.buy._r.filter(x => x.ex > 0).length + S.avoid._r.filter(x => x.ex != null && x.ex < 0).length;
  const tgt = rows.filter(x => x.ev.plan === 'target').length, stp = rows.filter(x => x.ev.plan === 'stop').length;
  const ordered = S.buy.ex != null && S.avoid.ex != null ? S.buy.ex > S.avoid.ex : null;
  const noScore = rows.filter(x => !x.sc).length;
  const filt = `<div class="pp-filter">
      <button class="rank-chip ${paperAccFilter === 'all' ? 'active' : ''}" onclick="paperAccFilter='all';drawPaperData()">전체</button>
      <button class="rank-chip ${paperAccFilter === 'live' ? 'active' : ''}" onclick="paperAccFilter='live';drawPaperData()">실시간 주문만</button></div>`;
  if (!rows.length) {
    box.innerHTML = `<div class="pp-title">🎯 신호 정확도 점검 ${filt}</div>
      <div class="pp-empty">체결된 매수가 쌓이면 '점수가 높을 때 산 종목이 정말 지수보다 잘 올랐는지'를 여기서 점검해요.</div>`;
    return;
  }
  const f = v => v == null ? '-' : `<span class="${ppCls(v)}">${ppPct(v)}</span>`;
  box.innerHTML = `<div class="pp-title">🎯 신호 정확도 점검 <span class="rank-meta">매수 ${rows.length}건${noScore ? ` (점수 없음 ${noScore})` : ''}</span> ${filt}</div>
    <div class="pp-badges">
      <div class="pp-badge"><span class="pp-k">방향 적중률</span><b>${hitN ? `${Math.round(hit / hitN * 100)}%` : '-'}</b>
        <span class="pp-k">${hitN ? `${hit}/${hitN}건 · 매수 고려↑ · 주의↓ (지수 대비)` : '매수 고려·주의 판정 건 없음'}</span></div>
      <div class="pp-badge"><span class="pp-k">목표가 먼저 도달</span><b>${tgt + stp ? `${Math.round(tgt / (tgt + stp) * 100)}%` : '-'}</b>
        <span class="pp-k">목표 ${tgt} · 손절 ${stp} · 진행 중 ${rows.length - tgt - stp}</span></div>
      <div class="pp-badge"><span class="pp-k">점수 순서</span><b>${ordered == null ? '-' : ordered ? '✓ 맞음' : '✗ 역전'}</b>
        <span class="pp-k">매수 고려 초과수익 ${S.buy.ex == null ? '-' : ppPct(S.buy.ex)} vs 주의 ${S.avoid.ex == null ? '-' : ppPct(S.avoid.ex)}</span></div>
    </div>
    <div class="pp-scroll"><table class="pp-table">
      <tr><th>진입 판정</th><th>건수</th><th>평균 수익</th><th>지수 대비</th><th>지수 이긴 비율</th><th>20거래일 초과수익</th><th>목표/손절</th></tr>
      ${stats.map(s => `<tr><td>${s.label}</td><td>${s.n}</td><td>${f(s.ret)}</td><td>${f(s.ex)}</td>
        <td>${s.beat == null ? '-' : Math.round(s.beat) + '%'}</td><td>${s.n20 ? `${f(s.ex20)} <span class="pp-tk">(${s.n20}건)</span>` : '-'}</td>
        <td>${s.target}/${s.stop}</td></tr>`).join('')}
    </table></div>
    <div class="pp-explain">
      진입 점수 = 주문 당시 화면의 종합 점수(실시간 주문) 또는 그 날 직전 종가까지로 다시 계산한 차트 점수(과거 지정·점수 미수집).
      지수 대비 = 같은 기간 ${m === 'kr' ? 'KOSPI/KOSDAQ' : 'S&P 500'} 수익을 뺀 값 · 20거래일 초과수익은 체결 뒤 20거래일이 지난 건만(백테스트와 같은 기간).
      목표/손절 = 진입 때 매매플랜 가격에 어느 쪽이 먼저 닿았는지(일봉 기준, 같은 날이면 손절로 봄).
      ${nBack ? `과거 날짜를 지정한 주문 ${nBack}건은 결과를 알고 고를 수 있어(사후 선택 편향) '실시간 주문만'으로 따로 보세요.` : ''}
      건수가 적으면(각 판정 10건 미만) 우연일 수 있어요.
    </div>`;
}

// ── 시세 평가 · 대기 주문 체결 ──
async function refreshPaperEval(force) {
  const m = selectedMarket;
  const lots = paper.orders.filter(o => o.market === m && o.side === 'buy' && o.status === 'filled')
    .map(o => ({ id: o.id, ticker: o.ticker, fill_date: o.fill_date, price: o.price, ...ppPlan(o) }));
  const key = m + ':' + lots.map(l => `${l.id}${l.stop}${l.target}`).join(',');
  if (paperEval.loading || (!force && paperEval.key === key && Date.now() - paperEval.at < 60000)) return;
  if (!lots.length) { paperEval = { key, at: Date.now(), data: {}, error: '', loading: false }; return; }
  paperEval.loading = true;
  drawPaperData();
  try {
    const res = await apiFetch(`${API}/paper/evaluate`, {
      method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ lots }),
    }, 60000);
    const json = await res.json();
    if (!json.success) throw new Error(json.error || '평가 실패');
    paperEval = { key, at: Date.now(), data: { ...paperEval.data, ...json.data }, error: '', loading: false };
  } catch (e) {
    paperEval = { ...paperEval, key, at: Date.now(), error: e.message, loading: false };
  }
  drawPaperData();
}

async function paperQuote(ticker, atIso) {
  const q = atIso ? `&at=${encodeURIComponent(atIso)}` : '';
  const res = await apiFetch(`${API}/paper/quote?ticker=${encodeURIComponent(ticker)}${q}`, {}, 45000);
  const json = await res.json();
  if (!json.success) throw new Error(json.error || '체결가 조회 실패');
  return json.data;
}

function paperApplyFill(o, d) {
  Object.assign(o, { status: 'filled', price: d.price, fill_at: d.fill_at, fill_date: d.fill_date, src: d.src, note: d.note, sig: d.signal || null });
}

async function resolvePending(force) {
  const due = paper.orders.filter(o => o.status === 'pending' && new Date(o.at) <= Date.now());
  if (!due.length || paperResolving || (!force && Date.now() - paperPendingAt < 60000)) return;
  paperResolving = true; paperPendingAt = Date.now();
  let changed = false;
  try {
    // 시간순으로 처리해야 앞선 매수가 뒤 매도의 수량을 채운다
    for (const o of due.sort((a, b) => new Date(a.at) - new Date(b.at))) {
      try {
        const d = await paperQuote(o.ticker, o.at);
        if (d.status !== 'filled') continue;
        const before = { ...o };
        paperApplyFill(o, d);
        if (paperBook(o.market).bad === o) {
          Object.assign(o, before, { status: 'failed', error: `체결 불가 — ${paperBadMsg()}` });
        }
        changed = true;
      } catch (e) {
        if (/시세 없음/.test(e.message)) { o.status = 'failed'; o.error = e.message; changed = true; }
      }
    }
  } finally { paperResolving = false; }
  if (changed) { paperSave(); drawPaperData(); refreshPaperEval(true); }
}

    </div>
    <div class="pp-row2">
      <div class="pp-field"><label>수량(주)</label><input type="number" id="pp-qty" min="1" step="1" inputmode="numeric" value="${esc(f.qty)}" oninput="paperForm.qty=this.value;paperForm.preview=null;drawPaperPreview()"></div>
      <div class="pp-field"><label>또는 금액(${m === 'kr' ? '원' : '$'})</label><input type="number" id="pp-amt" min="0" inputmode="decimal" value="${esc(f.amount)}" ${f.side === 'sell' ? 'disabled placeholder="매도는 수량"' : ''} oninput="paperForm.amount=this.value;paperForm.preview=null;drawPaperPreview()"></div>
    </div>

        <label><input type="radio" name="ppwhen" ${f.when === 'at' ? 'checked' : ''} onchange="paperWhen('at')"> 날짜·시간 지정</label>
      </div>
      ${f.when === 'at' ? `<input type="datetime-local" id="pp-at" value="${esc(f.at)}" oninput="paperForm.at=this.value;paperForm.preview=null;paperAtHint();drawPaperPreview()">` : ''}
      <div class="pp-hint" id="pp-at-hint"></div>
    </div>
    <button style="width:100%" onclick="paperPreview()" ${f.busy ? 'disabled' : ''}>${f.busy ? '체결가 확인 중...' : '주문 미리보기'}</button>
    <div class="pp-preview" id="pp-preview"></div>`;
  paperAtHint();
  drawPaperPreview();
}

function paperAtHint() {
  const el = document.getElementById('pp-at-hint');
  if (!el) return;
  const f = paperForm, m = f.ticker ? tickerMarket(f.ticker) : selectedMarket;
  const sess = m === 'kr' ? '정규장 09:00~15:30' : '정규장 뉴욕 09:30~16:00';
  if (f.when === 'now') { el.textContent = `${sess} · 장중이면 현재가, 장이 닫혀 있으면 다음 거래일 시가에 체결돼요.`; return; }
  let ny = '';
  if (m === 'us' && f.at) {
    const d = new Date(`${f.at}:00+09:00`);
    if (!isNaN(d)) ny = ` = 뉴욕 ${d.toLocaleString('ko-KR', { timeZone: 'America/New_York', month: 'numeric', day: 'numeric', hour: '2-digit', minute: '2-digit', hour12: false })}`;
  }
  el.textContent = `한국시간 기준${ny} · 과거면 그때 가격으로, 미래면 예약 주문으로 들어가요. ${sess} 밖이면 다음 거래일 시가.`;
}

function paperSide(s) { paperForm.side = s; paperForm.preview = null; if (s === 'sell') paperForm.amount = ''; drawPaperForm(); }
function paperWhen(w) { paperForm.when = w; paperForm.preview = null; drawPaperForm(); }
function paperQtyAll() {
  const m = tickerMarket(paperForm.ticker);
  paperForm.qty = String((paperBook(m).pos[paperForm.ticker] || {}).qty || '');
  paperForm.preview = null;
  drawPaperForm();
}

let paperSugTimer = null, paperSugSeq = 0;
function paperSearch(v) {
  paperForm.ticker = ''; paperForm.name = ''; paperForm.preview = null;
  drawPaperPreview();
  clearTimeout(paperSugTimer);
  const q = v.trim();
  const box = document.getElementById('pp-sug');
  if (!q) { box.innerHTML = ''; return; }
  paperSugTimer = setTimeout(async () => {
    const seq = ++paperSugSeq;
    try {
      const res = await apiFetch(`${API}/search?q=${encodeURIComponent(q)}`, {}, 15000);
      const list = await res.json();
      if (seq !== paperSugSeq) return;
      box.innerHTML = (Array.isArray(list) ? list : []).slice(0, 8).map(r =>
        `<div class="sug-item" onclick="paperPick('${esc(r.ticker)}', '${esc(String(r.name || '').replace(/'/g, ''))}')">
          <span class="sug-ticker">${esc(r.ticker)}</span><span class="sug-name">${esc(r.name)}</span>
          <span class="sug-exch">${tickerMarket(r.ticker) === 'kr' ? '국내' : '해외'}</span></div>`).join('')
        || '<div class="sug-item sug-dim">검색 결과 없음</div>';
    } catch (e) { if (seq === paperSugSeq) box.innerHTML = '<div class="sug-item sug-dim">검색 실패</div>'; }
  }, 300);
}

function paperPick(t, name) {
  paperForm.ticker = t.toUpperCase();
  paperForm.name = name || (stocks[t] && stocks[t].name) || t;
  paperForm.preview = null;
  const m = tickerMarket(paperForm.ticker);
  if (m !== selectedMarket) switchMarket(m);   // 그 시장 계좌로 이동(→ renderAll이 탭을 다시 그림)
  drawPaperForm();
}

// 진입 신호 카드 등에서 바로 주문 창 열기
function openPaperOrder(t, side) {
  const name = (stocks[t] && stocks[t].name) || t;
  paperForm = { ...paperForm, ticker: t.toUpperCase(), name, side: side || 'buy', qty: '', amount: '', preview: null };
  const m = tickerMarket(t);
  if (m !== selectedMarket) switchMarket(m);
  switchTab('paper');
  drawPaperForm();
  window.scrollTo({ top: 0, behavior: 'smooth' });
}
function paperSellPrefill(t) {
  const o = paper.orders.find(x => x.ticker === t);
  paperForm = { ...paperForm, ticker: t, name: (o && o.name) || t, side: 'sell', amount: '', preview: null,
    qty: String((paperBook(tickerMarket(t)).pos[t] || {}).qty || '') };
  drawPaperForm();
  document.getElementById('pp-form').scrollIntoView({ behavior: 'smooth', block: 'start' });
}

async function paperPreview() {
  const f = paperForm;
  const err = msg => { f.preview = { error: msg }; drawPaperPreview(); };
  if (!paper) return err('계좌를 불러오는 중이에요. 잠시 후 다시 시도하세요.');
  if (!f.ticker) return err('검색 목록에서 종목을 골라 주세요.');
  const qty0 = parseInt(f.qty, 10), amt = parseFloat(f.amount);
  if (!(qty0 > 0) && !(f.side === 'buy' && amt > 0)) return err('수량(또는 매수 금액)을 입력하세요.');
  let atIso = null;
  if (f.when === 'at') {
    if (!f.at || isNaN(new Date(`${f.at}:00+09:00`))) return err('날짜·시간을 입력하세요.');
    atIso = `${f.at}:00+09:00`;
  }
  f.busy = true; f.preview = null; drawPaperForm();
  let d;
  try { d = await paperQuote(f.ticker, atIso); }
  catch (e) { f.busy = false; drawPaperForm(); return err(e.message); }
  f.busy = false;
  const m = tickerMarket(f.ticker), now = new Date().toISOString();
  let qty = qty0;
  if (!(qty > 0)) {
    if (d.status !== 'filled') { drawPaperForm(); return err('예약·대기 주문은 체결가를 아직 몰라 수량으로 입력해야 해요.'); }
    qty = Math.floor(amt / (d.price * (1 + PAPER_FEES[m].buy)));
    if (!(qty > 0)) { drawPaperForm(); return err(`금액이 1주 가격(${ppMoney(d.price, m)})보다 적어요.`); }
  }
  const o = {
    id: 'o' + Date.now().toString(36) + Math.random().toString(36).slice(2, 6),
    ticker: f.ticker, name: f.name, market: m, side: f.side, qty,
    at: atIso || now, placed: now, status: 'pending', note: d.note,
  };
  if (d.status === 'filled') {
    paperApplyFill(o, d);
    // 체결 시각보다 하루 넘게 지나서 낸 주문 = 결과를 보고 고를 수 있는 '과거 지정' 주문
    o.backdated = f.when === 'at' && (Date.now() - new Date(d.fill_at)) > 86400000;
    const bad = paperBook(m, paper.orders.concat([o])).bad;
    if (bad) { f.preview = { order: o, error: bad === o ? paperBadMsg() : '이 주문을 넣으면 뒤에 있는 매도의 보유 수량이 모자라게 돼요.' }; drawPaperForm(); return; }
  }
  f.preview = { order: o };
  drawPaperForm();
}

function drawPaperPreview() {
  const box = document.getElementById('pp-preview');
  if (!box) return;
  const p = paperForm.preview;
  if (!p) { box.innerHTML = ''; return; }
  const o = p.order;
  if (!o) { box.innerHTML = `<div class="pp-err">${esc(p.error)}</div>`; return; }
  const m = o.market, fee = PAPER_FEES[m][o.side];
  const kv = (k, v) => `<div class="pp-kv"><span>${k}</span><span>${v}</span></div>`;
  let html;
  if (o.status === 'filled') {
    const gross = o.qty * o.price;
    const sig = o.sig;
    html = kv('체결가', `<b>${ppMoney(o.price, m)}</b>`) + kv('체결 시각', ppTime(o.fill_at, m))
      + kv('근거', esc(o.note)) + kv('수량 · 금액', `${o.qty.toLocaleString()}주 · ${ppMoney(gross, m)}`)
      + kv('수수료·세금', ppMoney(gross * fee, m))
      + (sig ? kv('그 시점 차트 점수', `${sig.tech} (${scoreLabel(sig.tech).text})`) : '');
  } else {
    html = kv('상태', '<b style="color:var(--yellow)">체결 대기</b>') + kv('근거', esc(o.note))
      + kv('수량', `${o.qty.toLocaleString()}주`) + '<div class="pp-hint">체결가는 그 시각이 되면 정해져요(이 화면을 열 때 자동 확인).</div>';
  }
  box.innerHTML = html + (p.error ? `<div class="pp-err">${esc(p.error)}</div>` : '')
    + `<div class="pp-btns"><button class="secondary" onclick="paperForm.preview=null;drawPaperPreview()">취소</button>
       ${p.error ? '' : `<button onclick="paperConfirm()" style="background:${o.side === 'buy' ? 'var(--red)' : 'var(--blue)'}">${o.side === 'buy' ? '매수' : '매도'} ${o.status === 'filled' ? '확정' : '예약'}</button>`}</div>`;
}

function paperConfirm() {
  const p = paperForm.preview;
  if (!p || !p.order || p.error) return;
  const o = p.order;
  // 지금 주문이면 화면에 떠 있는 실시간 종합 신호를 함께 기록(정확도 점검용)
  if (paperForm.when === 'now' && o.side === 'buy') {
    const s = signals[o.ticker];
    if (s) o.live = { combined: s.combined, verdict: s.signal, tech: s.tech_score, fund: s.fund_score,
      stop: s.plan ? s.plan.stop : null, target: s.plan ? s.plan.target : null };
    else paperAttachLive(o.id, o.ticker);
  }
  paper.orders.push(o);
  paperForm = { ...paperForm, qty: '', amount: '', preview: null };
  paperSave();
  drawPaperForm();
  drawPaperData();
  refreshPaperEval(true);
}

// 신호가 아직 없으면(다른 그룹 종목 등) 뒤에서 받아 붙인다 — 실패해도 차트 점수로 평가됨.
async function paperAttachLive(id, ticker) {
  try {
    const res = await apiFetch(`${API}/signal/${ticker}`, {}, SIGNAL_TIMEOUT_MS);
    const json = await res.json();
    const o = paper && paper.orders.find(x => x.id === id);
    if (!json.success || !o) return;
    const s = json.data;
    o.live = { combined: s.combined, verdict: s.signal, tech: s.tech_score, fund: s.fund_score,
      stop: s.plan ? s.plan.stop : null, target: s.plan ? s.plan.target : null };
    paperSave();
    drawPaperData();
  } catch (e) {}
}

function paperCancel(id) {
  const o = paper.orders.find(x => x.id === id);
  if (!o || o.status !== 'pending') return;
  o.status = 'canceled';
  paperSave(); drawPaperData();
}
function paperDelete(id) {
  const o = paper.orders.find(x => x.id === id);
  if (!o || !confirm(`${o.name || o.ticker} ${o.side === 'buy' ? '매수' : '매도'} ${o.qty}주 기록을 지울까요?`)) return;
  const rest = paper.orders.filter(x => x.id !== id);
  if (o.status === 'filled' && paperBook(o.market, rest).bad) {
    showError('이 매수를 지우면 뒤에 있는 매도의 보유 수량이 모자라 지울 수 없어요. 뒤의 매도부터 지우세요.');
    return;
  }
  paper.orders = rest;
  delete paperEval.data[id];
  paperSave(); drawPaperData();
}
function paperResetMarket() {
  const m = selectedMarket;
  if (!confirm(`${m === 'kr' ? '국내' : '해외'} 모의투자 계좌의 주문 기록을 모두 지우고 처음부터 시작할까요?`)) return;
  paper.orders = paper.orders.filter(o => o.market !== m);
  paperEval = { key: '', at: 0, data: {}, error: '', loading: false };
  paperSave(); drawPaperForm(); drawPaperData();
}

// ---- 유틸 ----
function esc(s) {
  return String(s == null ? '' : s).replace(/[&<>"']/g, c =>
    ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}
function fmt(v, currency='USD') {
  if (v == null) return '-';
  return new Intl.NumberFormat('ko-KR', { style:'currency', currency: currency||'USD', maximumFractionDigits: 2 }).format(v);
}
function pct(v) { return v != null ? `${v.toFixed(2)}%` : '-'; }
function pct100(v) { return v != null ? `${(v*100).toFixed(2)}%` : '-'; }
function bigNum(v) {
  if (v == null) return '-';
  if (Math.abs(v) >= 1e12) return (v/1e12).toFixed(2)+'T';
  if (Math.abs(v) >= 1e9) return (v/1e9).toFixed(2)+'B';
  if (Math.abs(v) >= 1e6) return (v/1e6).toFixed(2)+'M';
  return v.toFixed(0);
}

function showError(msg) {
  const el = document.getElementById('error-toast');
  el.textContent = msg;
  el.style.display = 'block';
  setTimeout(() => el.style.display = 'none', 4000);
}

function setLoadingBar(pct) {
  const bar = document.getElementById('loading-bar');
  bar.style.width = pct + '%';
  if (pct >= 100) setTimeout(() => bar.style.width = '0%', 500);
}

// 자동완성 — 야후 파이낸스 실시간 검색
const input = document.getElementById('ticker-input');
const sug = document.getElementById('suggestions');
let searchTimer = null;
let selectedIdx = -1;

async function fetchSuggestions(raw) {
  // 검색어 그대로 서버에 전달 — KRX 로컬 DB로 한국어 검색, 영문은 야후 파이낸스
  let results = [];
  try {
    const res = await apiFetch(`${API}/search?q=${encodeURIComponent(raw.trim())}`);
    results = await res.json();
    if (!results.length) { hideSug(); return; }
    selectedIdx = -1;
    sug.innerHTML = results.map((r, i) => {
      const already = curGroup().tickers.includes(r.ticker);
      return `<div class="sug-item ${already ? 'sug-dim' : ''}" data-ticker="${esc(r.ticker)}" data-idx="${i}">
        <span class="sug-ticker">${esc(r.ticker)}</span>
        <span class="sug-name">${esc(r.name)}</span>
        <span class="sug-exch">${esc(r.exchange)}</span>
      </div>`;
    }).join('');
    sug.querySelectorAll('.sug-item:not(.sug-dim)').forEach(el => {
      el.addEventListener('click', () => {
        quickAdd(el.dataset.ticker);
        input.value = '';
        hideSug();
      });
    });
    sug.style.display = 'block';
  } catch(e) { hideSug(); }
}

function hideSug() { sug.style.display = 'none'; selectedIdx = -1; }

input.addEventListener('keydown', e => {
  const items = sug.querySelectorAll('.sug-item:not(.sug-dim)');
  if (e.key === 'ArrowDown') { e.preventDefault(); selectedIdx = Math.min(selectedIdx+1, items.length-1); highlightSug(items); }
  else if (e.key === 'ArrowUp') { e.preventDefault(); selectedIdx = Math.max(selectedIdx-1, -1); highlightSug(items); }
  else if (e.key === 'Enter') {
    if (selectedIdx >= 0 && items[selectedIdx]) { quickAdd(items[selectedIdx].dataset.ticker); input.value = ''; hideSug(); }
    else addTicker();
  } else if (e.key === 'Escape') hideSug();
});

function highlightSug(items) {
  items.forEach((el, i) => el.classList.toggle('sug-selected', i === selectedIdx));
}

input.addEventListener('input', () => {
  clearTimeout(searchTimer);
  const v = input.value.trim();
  if (!v) { hideSug(); return; }
  searchTimer = setTimeout(() => fetchSuggestions(v), 250);
});

document.addEventListener('click', e => { if (!e.target.closest('#search-bar')) hideSug(); });

// ── 스크롤 방향에 따라 헤더 자동 숨김(내릴 때)·표시(올릴 때) ──
(function () {
  const header = document.querySelector('header');
  const sugg = document.getElementById('suggestions');
  let lastY = window.scrollY, ticking = false;
  function update() {
    const y = window.scrollY;
    const suggOpen = sugg && sugg.offsetParent !== null;   // 검색 추천 열림
    if (y <= 56 || suggOpen) {
      header.classList.remove('header-hidden');            // 맨 위·검색 중엔 항상 표시
    } else if (y - lastY > 4) {
      header.classList.add('header-hidden');               // 내릴 때 숨김
    } else if (lastY - y > 4) {
      header.classList.remove('header-hidden');            // 올릴 때 표시
    }
    lastY = y;
    ticking = false;
  }
  window.addEventListener('scroll', () => {
    if (!ticking) { requestAnimationFrame(update); ticking = true; }
  }, { passive: true });
})();

// 모든 선언·리스너 등록 후 마지막에 초기화 (const TDZ 방지)
startRefreshLoop();
restoreState();
</script>
